name: vault
on:
  schedule:
    - cron: "37 4 1 * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Mirror, checksum and licence-check every tool in vault/vault.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/vault_mirror.py
      # main accepts pull requests only (ruleset), so the lock file arrives as a PR the owner merges.
      - name: Open a pull request with the lock file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "firnlab-vault"
          git config user.email "firnlab-vault@users.noreply.github.com"
          git add vault/lock.json
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          b="vault/lock-$(date -u +%F-%H%M)"
          git checkout -b "$b"
          git commit -m "vault: lock $(date -u +%F)"
          git push -u origin "$b"
          gh pr create --base main --head "$b" --title "vault: lock $(date -u +%F)" --body "Monthly vault mirror: checksums and licence checks in vault/lock.json. Merge when the quick gate is green."
          # A PR opened with the workflow's own token starts no other workflow (GitHub rule), so the required checks
          # would never report. workflow_dispatch is the documented exception: start the gate on the branch explicitly.
          gh workflow run quick-gate.yml --ref "$b"
      - name: Open an issue when a licence or a download turned red
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue create --title "vault red $(date -u +%F)" --body "A tool in vault/vault.json failed its licence check or download. See the vault workflow run." --label bug || true
