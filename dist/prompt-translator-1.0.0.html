<title>Prompt Translator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout concept: mission-control workspace — slim navigation rail, one focused work surface with a persistent North Star band, and a notes drawer on the right. Dark-first instrument panel; light mode mirrors it. */
:root{
  --bg:#0a0e16; --bg-2:#0e1420; --surface:#121a29; --surface-2:#172134; --line:#223049; --line-2:#2c3c5a;
  --fg:#e7edf7; --fg-2:#b5c0d3; --muted:#8392ab;
  --accent:#5aa2ff; --accent-2:#8fc1ff; --accent-ink:#06101f; --accent-soft:rgba(90,162,255,.13);
  --signal:#f2b84b; --signal-soft:rgba(242,184,75,.14);
  --ok:#3fcf8e; --ok-soft:rgba(63,207,142,.13); --warn:#f2b84b; --warn-soft:rgba(242,184,75,.14); --crit:#ff6b6b; --crit-soft:rgba(255,107,107,.13);
  --glow:0 0 0 1px rgba(90,162,255,.35),0 0 24px rgba(90,162,255,.12);
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --f-display:"Chakra Petch","IBM Plex Sans","Noto Sans SC",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --r-sm:7px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f3f5f9; --bg-2:#eaeef5; --surface:#ffffff; --surface-2:#f6f8fc; --line:#d9e0eb; --line-2:#c5cfdf;
  --fg:#0d1626; --fg-2:#334058; --muted:#5f6c84;
  --accent:#1f5fd1; --accent-2:#174aa6; --accent-ink:#ffffff; --accent-soft:rgba(31,95,209,.09);
  --signal:#a86a00; --signal-soft:rgba(200,130,0,.11);
  --ok:#11845a; --ok-soft:rgba(17,132,90,.10); --warn:#a86a00; --warn-soft:rgba(200,130,0,.11); --crit:#c2302f; --crit-soft:rgba(194,48,47,.09);
  --glow:0 0 0 1px rgba(31,95,209,.35),0 0 18px rgba(31,95,209,.10);
  --shadow:0 10px 30px rgba(20,35,70,.12);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#f3f5f9; --bg-2:#eaeef5; --surface:#ffffff; --surface-2:#f6f8fc; --line:#d9e0eb; --line-2:#c5cfdf;
  --fg:#0d1626; --fg-2:#334058; --muted:#5f6c84;
  --accent:#1f5fd1; --accent-2:#174aa6; --accent-ink:#ffffff; --accent-soft:rgba(31,95,209,.09);
  --signal:#a86a00; --signal-soft:rgba(200,130,0,.11);
  --ok:#11845a; --ok-soft:rgba(17,132,90,.10); --warn:#a86a00; --warn-soft:rgba(200,130,0,.11); --crit:#c2302f; --crit-soft:rgba(194,48,47,.09);
  --glow:0 0 0 1px rgba(31,95,209,.35),0 0 18px rgba(31,95,209,.10);
  --shadow:0 10px 30px rgba(20,35,70,.12);
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
::selection{background:var(--accent-soft)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:24px} h2{font-size:19px} h3{font-size:15px} h4{font-size:13px}
p{margin:0}
svg.ic{width:16px;height:16px;flex:none}
code,pre,.mono{font-family:var(--f-mono);font-size:12.5px}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%;overflow:hidden}
.app.with-drawer{grid-template-columns:236px minmax(0,1fr) 360px}
.rail{background:var(--bg-2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px}
.brand-mark{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#7b5cff);color:#fff;font-family:var(--f-display);font-weight:700;font-size:13px;box-shadow:var(--glow);flex:none}
.brand-name{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.02em;line-height:1.1}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.04em}
.ws-switch{margin:4px 12px 10px;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);cursor:pointer;text-align:left;width:calc(100% - 24px)}
.ws-switch:hover{border-color:var(--line-2)}
.ws-dot{width:10px;height:10px;border-radius:50%;flex:none}
.ws-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px;padding:4px 8px}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:14px 10px 6px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);border:0;background:none;color:var(--fg-2);cursor:pointer;text-align:left;width:100%}
.nav-btn:hover{background:var(--surface);color:var(--fg)}
.nav-btn.on{background:var(--accent-soft);color:var(--fg);box-shadow:inset 2px 0 0 var(--accent)}
.nav-btn .ic{width:16px;height:16px;flex:none;opacity:.85}
.nav-btn .count{margin-left:auto;font-size:11px;color:var(--muted)}
.nav-proj{font-size:13px}
.rail-foot{margin-top:auto;padding:12px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.main{min-width:0;min-height:0;overflow-y:auto;position:relative}
.main-inner{padding:20px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px));max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.drawer{border-left:1px solid var(--line);background:var(--bg-2);min-height:0;display:flex;flex-direction:column}

/* ---------- Top bar & North Star ---------- */
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h1{flex:1;min-width:200px}
.crumb{font-size:12px;color:var(--muted);letter-spacing:.04em}
.northstar{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,var(--surface),var(--surface-2));padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start;position:relative;overflow:hidden}
.northstar::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:linear-gradient(var(--accent),#7b5cff)}
.ns-icon{width:28px;height:28px;color:var(--accent)}
.ns-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 18px}
.ns-k{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.ns-v{font-size:13px;color:var(--fg);overflow-wrap:anywhere}
.ns-v.empty{color:var(--muted);font-style:italic}

/* ---------- Phase spine ---------- */
.spine{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.ph{flex:1 0 auto;min-width:92px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:7px 10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;position:relative}
.ph:hover{border-color:var(--line-2)}
.ph .n{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.ph .l{font-size:12.5px;font-weight:500;white-space:nowrap}
.ph .bar{height:3px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
.ph .bar i{display:block;height:100%;background:var(--accent)}
.ph.on{border-color:var(--accent);box-shadow:var(--glow)}
.ph.done .bar i{background:var(--ok)}

/* ---------- Panels & cards ---------- */
.panel{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel.flat{background:transparent}
.panel-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-h h2,.panel-h h3{flex:1;min-width:160px}
.sub{color:var(--muted);font-size:12.5px}
.lead{color:var(--fg-2);max-width:72ch}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.stack{display:flex;flex-direction:column;gap:8px;min-width:0}
.stack.lg{gap:14px}
.sep{height:1px;background:var(--line);border:0;margin:4px 0}
.muted{color:var(--muted)}
.small{font-size:12px}
.hint{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.empty-state{border:1px dashed var(--line-2);border-radius:var(--r);padding:22px;text-align:left;color:var(--fg-2);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}

/* ---------- Controls ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface-2);color:var(--fg);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--accent);}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fg-2)}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line)}
.btn.danger{color:var(--crit);border-color:var(--crit-soft)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn .ic{width:15px;height:15px}
.btn.ai::after{content:attr(data-cost);font-family:var(--f-mono);font-size:10px;padding:1px 5px;border-radius:4px;background:var(--accent-soft);color:var(--accent);margin-left:2px}
.btn.primary.ai::after{background:rgba(255,255,255,.2);color:inherit}
.iconbtn{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:var(--r-sm);border:1px solid transparent;background:none;color:var(--fg-2);cursor:pointer}
.iconbtn:hover{background:var(--surface-2);border-color:var(--line)}
.iconbtn .ic{width:16px;height:16px}
input[type=text],input[type=password],input[type=search],input[type=number],select,textarea{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;color:var(--fg);min-width:0}
textarea{resize:vertical;min-height:84px;line-height:1.5}
textarea.code{font-family:var(--f-mono);font-size:12.5px;min-height:220px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);min-width:0}
label.fld>span{letter-spacing:.02em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--bg-2)}
.seg button{border:0;background:none;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--fg-2)}
.seg button.on{background:var(--accent-soft);color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.chk{display:flex;gap:9px;align-items:flex-start;cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--accent)}

/* ---------- Chips / pills ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;border:1px solid var(--line);color:var(--fg-2);background:var(--bg-2);white-space:nowrap}
.chip.wrap{white-space:normal;max-width:100%;align-items:flex-start;border-radius:10px}
.chip.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.chip.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.chip.crit{color:var(--crit);background:var(--crit-soft);border-color:transparent}
.chip.acc{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.chip.tap{cursor:pointer}
.chip.tap:hover{border-color:var(--accent);color:var(--fg)}
.chip.sel{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.crit{background:var(--crit)} .dot.mut{background:var(--line-2)}

/* ---------- Lists / items ---------- */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;gap:12px;padding:11px 14px;border-top:1px solid var(--line);align-items:flex-start;background:var(--surface);min-width:0}
.item:first-child{border-top:0}
.item .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.item .title{font-weight:500;overflow-wrap:anywhere}
.item .body > .btn,.item .body > .chip,.panel > .btn,.stack > .btn,.stack > .chip,.empty-state > .btn{align-self:flex-start}
.item .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item .acts{display:flex;gap:4px;flex:none;align-items:center}
.item.sev-crit{box-shadow:inset 3px 0 0 var(--crit)} .item.sev-high{box-shadow:inset 3px 0 0 var(--warn)} .item.sev-med{box-shadow:inset 3px 0 0 var(--accent)} .item.sev-low{box-shadow:inset 3px 0 0 var(--line-2)}

/* ---------- Cockpit ---------- */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pcard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;min-width:0}
.pcard:hover{border-color:var(--accent);box-shadow:var(--glow)}
.pcard h3{font-size:16px}
.gauge{display:flex;align-items:center;gap:10px}
.gauge .track{flex:1;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.gauge .track i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),#7b5cff)}
.gauge b{font-family:var(--f-mono);font-size:12px;font-weight:500}
.briefing{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--accent-soft);display:flex;flex-direction:column;gap:6px}
.briefing h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}

/* ---------- Next action / spine helper ---------- */
.nextbar{display:flex;align-items:center;gap:12px;border:1px solid var(--accent);border-radius:var(--r);padding:10px 14px;background:var(--accent-soft);flex-wrap:wrap}
.nextbar .lbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
.nextbar .txt{flex:1;min-width:200px}

/* ---------- Radar ---------- */
.radar-wrap{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start}
.radar svg{width:100%;height:auto;display:block}
.dimlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dim{border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;display:flex;flex-direction:column;gap:3px;background:var(--bg-2);min-width:0}
.dim .dh{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500}
.dim .ds{font-size:12px;color:var(--fg-2);overflow-wrap:anywhere}
.dim .dc{font-size:11.5px;color:var(--muted)}

/* ---------- Interview ---------- */
.qcard{border:1px solid var(--line-2);border-radius:var(--r);padding:16px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px}
.qcard .qd{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
.qcard .qt{font-size:15px;font-weight:500;line-height:1.45}
.qcard .qw{font-size:12.5px;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line-2);border-radius:var(--r-sm);padding:6px 10px;background:var(--bg-2);cursor:pointer;font-size:13px;text-align:left;max-width:100%}
.opt:hover{border-color:var(--accent)}
.opt.rec{border-color:var(--accent)}
.opt.rec::before{content:"★ ";color:var(--accent)}
.opt.on{background:var(--accent-soft);border-color:var(--accent)}
.qa{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-top:1px solid var(--line)}
.qa:first-child{border-top:0}
.qa .q{font-size:12.5px;color:var(--muted)}
.qa .a{font-size:13.5px}

/* ---------- Matrix / tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table.tbl{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
.tbl th,.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--bg-2)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tbl tr.rec td{background:var(--accent-soft)}
.score{display:inline-flex;gap:2px}
.score i{width:7px;height:12px;border-radius:2px;background:var(--line)}
.score i.f{background:var(--accent)}

/* ---------- Assumption map ---------- */
.amap{position:relative;border:1px solid var(--line);border-radius:var(--r);height:300px;background:
  linear-gradient(var(--line),var(--line)) 50% 0/1px 100% no-repeat,
  linear-gradient(var(--line),var(--line)) 0 50%/100% 1px no-repeat,var(--bg-2)}
.amap .q{position:absolute;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 8px}
.amap .q.tr{right:0;top:0;color:var(--crit)}
.amap .pt{position:absolute;transform:translate(-50%,50%);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:10.5px;font-weight:600;cursor:pointer;border:2px solid var(--bg-2)}
.amap .axis{position:absolute;font-size:11px;color:var(--muted)}

/* ---------- Diagram ---------- */
.diagram{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--bg-2);padding:8px}
.diagram svg{display:block;min-width:560px}
.mock{width:100%;height:420px;border:1px solid var(--line);border-radius:var(--r);background:#fff}

/* ---------- Package / code ---------- */
.pkg-sec{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.pkg-h{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.pkg-h .dest{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:600}
.pkg-h .t{font-weight:500;flex:1;min-width:140px}
.pkg-body{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.pkg-body.mirror{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pkg-col{padding:12px 14px;min-width:0}
.pkg-col+.pkg-col{border-left:1px solid var(--line)}
.pkg-col .lang{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
pre.prompt{white-space:pre-wrap;word-break:break-word;margin:0;font-family:var(--f-mono);font-size:12.5px;line-height:1.55;color:var(--fg);max-height:440px;overflow:auto}
.diff{font-family:var(--f-mono);font-size:12px;white-space:pre-wrap;word-break:break-word;max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;background:var(--bg-2)}
.diff .add{background:var(--ok-soft);color:var(--ok);display:block}
.diff .del{background:var(--crit-soft);color:var(--crit);display:block;text-decoration:line-through}
.lint{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:6px 0;border-top:1px solid var(--line)}
.lint:first-child{border-top:0}

/* ---------- Progress / AI state ---------- */
.busy{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;background:var(--surface-2)}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1.3s ease-in-out infinite;flex:none}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.1)}}
.stream{white-space:pre-wrap;font-family:var(--f-mono);font-size:12px;color:var(--fg-2);max-height:160px;overflow:auto}
.conf{font-size:11px;letter-spacing:.06em}

/* ---------- Drawer (notes) ---------- */
.dr-h{display:flex;align-items:center;gap:8px;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.dr-h h3{flex:1}
.dr-body{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.note{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.note.pinned{border-color:var(--signal)}
.note .nt{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.note .nm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.note .anchor{font-size:11.5px;color:var(--accent);cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.note img{max-width:100%;border-radius:6px;border:1px solid var(--line)}
.note-md h4{font-size:13px;margin:4px 0}
.note-md ul{margin:2px 0;padding-left:18px}
.note-md .ck{list-style:none;margin-left:-18px}
.anchor-dot{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--signal-soft);color:var(--signal);font-size:10.5px;font-weight:600;cursor:pointer;border:0}

/* ---------- Overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(3,6,12,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(60px,env(safe-area-inset-top,0px)) 16px 16px;z-index:50}
.modal{width:min(640px,100%);max-height:calc(100% - 40px);overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px}
.modal.wide{width:min(920px,100%)}
.palette input{font-size:15px;padding:12px 14px}
.pal-list{display:flex;flex-direction:column;max-height:360px;overflow:auto}
.pal-item{display:flex;gap:10px;padding:9px 12px;border-radius:var(--r-sm);cursor:pointer;align-items:center;border:0;background:none;text-align:left;width:100%;color:var(--fg)}
.pal-item.on,.pal-item:hover{background:var(--accent-soft)}
.pal-item .k{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.capture{position:fixed;left:50%;top:max(80px,env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(620px,calc(100% - 32px));background:var(--surface);border:1px solid var(--accent);border-radius:12px;box-shadow:var(--shadow),var(--glow);padding:12px;z-index:60;display:flex;flex-direction:column;gap:8px}
.capture input{font-size:15px;padding:11px 12px}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:70;max-width:min(420px,calc(100% - 32px))}
.toast{background:var(--surface);border:1px solid var(--line-2);border-left:3px solid var(--accent);border-radius:var(--r-sm);padding:10px 12px;box-shadow:var(--shadow);font-size:13px;display:flex;gap:10px;align-items:center}
.toast.err{border-left-color:var(--crit)} .toast.ok{border-left-color:var(--ok)}
.confirm-inline{border:1px solid var(--crit);background:var(--crit-soft);border-radius:var(--r-sm);padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}

/* ---------- Lock screen ---------- */
.lock{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:80;padding:16px}
.lock-card{width:min(420px,100%);border:1px solid var(--line-2);border-radius:14px;background:var(--surface);padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.ws-pick{display:flex;flex-direction:column;gap:8px}
.ws-opt{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg-2);cursor:pointer;text-align:left;width:100%}
.ws-opt:hover{border-color:var(--accent)}

/* ---------- Charts ---------- */
.spark svg{width:100%;height:120px;display:block}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--fg-2);font-size:13px;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}

/* ---------- Responsive ---------- */
@media (max-width:1100px){
  .app.with-drawer{grid-template-columns:236px minmax(0,1fr)}
  .app.with-drawer .drawer{position:fixed;right:0;top:0;bottom:0;width:min(380px,100%);z-index:40;box-shadow:var(--shadow)}
}
@media (max-width:820px){
  .app,.app.with-drawer{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);align-items:center}
  .rail .nav{flex-direction:row}
  .rail .nav-label,.rail .brand-sub,.rail .rail-foot,.rail .nav-proj{display:none}
  .ws-switch{width:auto;margin:0 8px}
  .grid2,.grid3,.radar-wrap,.dimlist,.ns-grid{grid-template-columns:minmax(0,1fr)}
  .northstar{grid-template-columns:minmax(0,1fr)}
  .northstar .ns-icon{display:none}
  .pkg-body.mirror{grid-template-columns:minmax(0,1fr)}
  .pkg-col+.pkg-col{border-left:0;border-top:1px solid var(--line)}
  .kv{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===================== 1.0 ===================== */
:root{--as:#d9a3ff;--as-soft:rgba(217,163,255,.13)}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){--as:#8a3fc0;--as-soft:rgba(138,63,192,.09)}}
:root[data-theme="light"]{--as:#8a3fc0;--as-soft:rgba(138,63,192,.09)}
.btn.xs{padding:3px 8px;font-size:11.5px;border-radius:6px}
.btn.lg{padding:10px 18px;font-size:14.5px}
.h1-input{font-family:var(--f-display);font-size:22px;font-weight:600;background:transparent;border-color:transparent;padding:2px 4px;margin-left:-4px}
.ns-title{font-family:var(--f-display);letter-spacing:.06em;font-size:12px;text-transform:uppercase;color:var(--accent)}
.fs-label{letter-spacing:.1em;text-transform:uppercase;color:var(--signal)}
.dot.as{background:var(--as)}.dot.bad{background:var(--crit)}.dot.todo{background:transparent;border:1.5px solid var(--line-2)}.dot.cur{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dot.k-ai{background:var(--accent)}.dot.k-code{background:var(--ok)}.dot.k-hybrid{background:#a37bff}.dot.k-human{background:var(--signal)}.dot.k-platform{background:var(--muted)}
.chip.st-ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.chip.st-as{color:var(--as);border-color:var(--as);background:var(--as-soft)}
.chip.st-bad{color:var(--crit);border-color:var(--crit);background:var(--crit-soft)}
.chip.st-warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.chip.st-todo{color:var(--muted)}
.chip.model{font-family:var(--f-mono);font-size:10.5px;color:var(--accent-2);border-color:rgba(90,162,255,.4)}
.bigfield{min-height:160px;font-size:15px;line-height:1.6}
.htools{display:inline-flex;gap:2px;margin-left:4px}
.htools .iconbtn{width:26px;height:26px;opacity:.7}.htools .iconbtn:hover{opacity:1}
.askbox{display:flex;flex-direction:column;gap:8px;border:1px dashed var(--line-2);border-radius:var(--r-sm);padding:10px;background:var(--bg-2);margin-top:8px}
.askbox textarea{min-height:56px}
.answer{border-left:2px solid var(--line-2);padding-left:10px;color:var(--fg);white-space:pre-wrap}
.proposal{border:1px solid var(--ok);background:var(--ok-soft);border-radius:var(--r-sm);padding:10px;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.proposal .ba{display:flex;flex-direction:column;gap:4px}
.itools{display:inline-flex;flex-wrap:wrap;gap:2px}
.explain{border-left:2px solid var(--accent);padding-left:10px;display:flex;flex-direction:column;gap:4px}
.audit{border-top:1px dashed var(--line);padding-top:6px;display:flex;flex-direction:column;gap:3px}
.item.as{box-shadow:inset 3px 0 0 var(--as)}.item.flagged{box-shadow:inset 3px 0 0 var(--warn)}.item.imp{box-shadow:inset 3px 0 0 var(--accent)}
.qa.as{border-left:3px solid var(--as);padding-left:8px}
.nocopy{display:flex;gap:8px;align-items:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r-sm);padding:8px 10px}
.pulse-once{animation:plo 1.6s ease-out 1}
@keyframes plo{0%{box-shadow:0 0 0 0 rgba(90,162,255,.7)}100%{box-shadow:0 0 0 14px rgba(90,162,255,0)}}
@media (prefers-reduced-motion: reduce){.pulse-once{animation:none}}
/* mode bar */
.modebar{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.modebtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 11px;cursor:pointer;text-align:left;position:relative;flex:1 1 130px;max-width:220px;color:var(--fg)}
.modebtn:hover{border-color:var(--line-2)}
.modebtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:var(--glow)}
.modebtn .mname{display:flex;gap:7px;align-items:center;font-family:var(--f-display);font-weight:600;font-size:13.5px}
.modebtn .mdesc{font-size:11.5px;color:var(--muted);line-height:1.35}
.modebtn .sug{position:absolute;top:-8px;right:8px;font-size:10px;background:var(--bg);border:1px solid var(--ok);color:var(--ok);border-radius:999px;padding:0 6px}
.modeopts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:auto}
/* banners & guide */
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:9px 12px;font-size:13px}
.banner.asb{border-color:var(--as);background:var(--as-soft)}
.banner.warnb{border-color:var(--warn);background:var(--warn-soft)}
.guide{border:1px solid var(--accent);background:linear-gradient(180deg,var(--accent-soft),transparent);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.guide .where{font-size:12px;color:var(--muted)}
.guide .what{font-size:15.5px;font-weight:600}
.guide p{color:var(--fg-2);max-width:72ch}
.gq{border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
/* step card + continue */
.stepcard{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.stepcard-line{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:7px 12px;cursor:pointer;color:var(--fg-2);font-size:13px}
.stepcard-line span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.controw{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.controw.bottom{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
/* steps mode */
.steps2{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;align-items:start}
.steps2>*{min-width:0}
.stepmain{display:flex;flex-direction:column;gap:14px;min-width:0}
.spine2{display:flex;flex-direction:column;gap:10px;position:sticky;top:12px}
.sgroup{display:flex;flex-direction:column;gap:1px}
.sglabel{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:2px 8px}
.spine2 button{display:flex;gap:8px;align-items:center;border:0;background:none;padding:6px 8px;border-radius:6px;cursor:pointer;text-align:left;color:var(--fg-2);font-size:13px}
.spine2 button:hover{background:var(--surface)}
.spine2 button[aria-current="step"]{background:var(--surface);color:var(--fg);font-weight:600}
.spine2 .sl{flex:1;min-width:0}
.badge{font-size:10px;font-family:var(--f-mono);border-radius:999px;padding:0 5px;color:var(--bg);font-weight:700}
.badge.bad{background:var(--crit)}.badge.warn{background:var(--warn)}.badge.as{background:var(--as)}
/* item rows */
.ilist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.irow+.irow{border-top:1px solid var(--line)}
.ihead{display:flex;gap:10px;align-items:center;padding:9px 12px;cursor:pointer;width:100%;text-align:left;background:none;border:0;color:var(--fg)}
.ihead:hover{background:var(--surface-2)}
.iid{font-size:11px;color:var(--muted);flex:none;min-width:26px}
.ititle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow.open .ititle{white-space:normal}
.irow.open{background:var(--surface-2)}
.irow[data-focus]{box-shadow:inset 3px 0 0 var(--accent)}
.ibody{padding:4px 14px 14px 44px;display:flex;flex-direction:column;gap:10px}
.gwt{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13.5px}
.gwt b{font-family:var(--f-mono);font-size:11px;color:var(--accent-2);font-weight:500;padding-top:2px;text-transform:uppercase}
/* blueprint map */
.bp2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,1fr);gap:16px;align-items:start}
.bp2>*{min-width:0}
.mapwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--bg-2);padding:14px;max-height:640px}
.mapwrap.full{max-height:72vh}
.bpmap{position:relative;display:flex;flex-direction:column;gap:56px;align-items:center;min-width:min-content;padding:6px 40px}
.bpmap.compact{gap:30px;padding:4px 18px}
.bp-edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.bp-edge{fill:none;stroke:var(--line-2);stroke-width:1.5}
.bp-ah{fill:var(--line-2)}
.bp-row{display:flex;gap:22px;justify-content:center;flex-wrap:nowrap;position:relative;z-index:1}
.bp-node{position:relative;display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;min-width:150px;max-width:240px;border:1.5px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px 12px 9px 14px;cursor:pointer;color:var(--fg)}
.bpmap.compact .bp-node{min-width:96px;max-width:150px;padding:6px 9px;font-size:12px}
.bp-node b{font-size:13px;line-height:1.3;white-space:normal;overflow-wrap:anywhere}
.bp-node .bp-k{font-size:11px;color:var(--muted)}
.bp-node .bp-st{position:absolute;top:8px;right:8px}
.bp-node.k-ai{border-left:4px solid var(--accent)}.bp-node.k-code{border-left:4px solid var(--ok)}.bp-node.k-hybrid{border-left:4px solid #a37bff}.bp-node.k-human{border-left:4px solid var(--signal)}.bp-node.k-platform{border-left:4px solid var(--muted)}
.bp-node:hover{border-color:var(--accent)}
.bp-node.sel{box-shadow:var(--glow);border-color:var(--accent)}
.bp-node.lnk{border-style:dashed;border-color:var(--accent-2)}
.bp-node.hit{background:var(--warn-soft);border-color:var(--warn)}
.bp-node.dim{opacity:.32}
.bp-badges{display:flex;gap:4px}
.bp-badges .b{font-style:normal;font-size:10px;font-family:var(--f-mono);border-radius:999px;padding:0 6px;color:var(--bg);font-weight:700}
.bp-badges .b.bad{background:var(--crit)}.bp-badges .b.warn{background:var(--warn)}.bp-badges .b.as{background:var(--as)}
.bp-label{position:absolute;transform:translate(-50%,-50%);font-size:10.5px;color:var(--muted);background:var(--bg-2);padding:0 5px;border-radius:4px;white-space:nowrap;z-index:2;pointer-events:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.strip{display:flex;gap:4px;flex-wrap:wrap}
.strip button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--fg-2)}
.strip button[aria-current="step"]{border-color:var(--accent);color:var(--fg)}
.fullstep{display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:14px}
.homeB{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);gap:16px;align-items:start}
.homeB>*{min-width:0}
.homeB .mini{position:sticky;top:12px;display:flex;flex-direction:column;gap:8px}
.homeB .mini .mapwrap{max-height:70vh;padding:8px}
/* journey */
.journey{overflow-x:auto;padding:6px 2px 4px}
.stations{display:grid;grid-template-columns:repeat(12,minmax(70px,1fr));min-width:840px;position:relative}
.stations::before{content:"";position:absolute;left:4%;right:4%;top:30px;height:2px;background:var(--line-2)}
.station{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;cursor:pointer;position:relative;padding:0 2px;color:var(--fg-2);font-size:11.5px;text-align:center;line-height:1.25}
.station .here{font-size:10px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.05em;min-height:13px}
.station .ring{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:2px solid var(--line-2);font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.station.done .ring{border-color:var(--ok);color:var(--ok)}
.station.attn .ring{border-color:var(--warn);color:var(--warn)}
.station.cur .ring{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 5px var(--accent-soft)}
.station.sel .sn{color:var(--fg);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:7px;cursor:pointer;text-align:left;color:var(--fg)}
.tile:hover{border-color:var(--line-2)}
.tile.sel{border-color:var(--accent);box-shadow:var(--glow)}
.tile .tn{display:flex;justify-content:space-between;gap:6px;align-items:center;font-family:var(--f-display);font-weight:600;font-size:13.5px}
.tile .tc{display:flex;gap:6px;flex-wrap:wrap}
.tile .tnext{font-size:12px;color:var(--fg-2)}
.meter{height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
/* swimlanes */
.lanes{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--bg-2)}
.lgrid{display:grid;min-width:720px}
.lgrid .lh{font-size:11px;color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--line);font-family:var(--f-mono)}
.lgrid .ln{padding:10px;border-top:1px solid var(--line);font-size:12.5px;font-weight:600;display:flex;align-items:center;background:var(--surface)}
.lgrid .lc{padding:8px 6px;border-top:1px solid var(--line);border-left:1px dashed var(--line);display:flex;flex-direction:column;gap:6px;min-height:50px}
.lpart{border:1px solid var(--line-2);background:var(--surface);border-radius:7px;padding:6px 8px;font-size:12px;cursor:pointer;text-align:left;display:flex;gap:6px;align-items:center;color:var(--fg)}
.lpart:hover{border-color:var(--accent)}
.lpart.sel{border-color:var(--accent);box-shadow:var(--glow)}
.lpart.hit{border-color:var(--warn);background:var(--warn-soft)}
.lpart.dim{opacity:.3}
.cbtn{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:6px 10px;font-size:12.5px;cursor:pointer;text-align:left;color:var(--fg)}
.cbtn[aria-pressed="true"]{border-color:var(--warn);background:var(--warn-soft)}
/* express */
.xp{display:flex;flex-direction:column;gap:12px;max-width:900px}
.bubble{border-radius:12px;padding:11px 14px;max-width:680px;font-size:14px}
.bubble.you{align-self:flex-end;background:var(--accent-soft);border:1px solid rgba(90,162,255,.35);white-space:pre-wrap}
.bubble.ai{background:var(--surface);border:1px solid var(--line)}
.xcard{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);overflow:hidden}
.xcard>header{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.xcard .ilist{border:0;border-radius:0}
.xnext{border:1px dashed var(--line-2);border-radius:var(--r);padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;color:var(--fg-2)}
/* start page */
.start{border-color:var(--accent)}
.mcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mcard{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px;display:flex;flex-direction:column;gap:5px;cursor:pointer;text-align:left;color:var(--fg)}
.mcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:var(--glow)}
.mcard small{color:var(--muted);font-size:11.5px;line-height:1.35}
.mcard .chip{align-self:flex-start}
.fu ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;color:var(--fg-2)}
/* launch / release / operate */
.ready{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ringbig{width:112px;height:112px}
.chk{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.chk.full{opacity:.85}
.chkhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chkhead .nm{flex:1;min-width:160px;font-weight:500}
.score{font-family:var(--f-mono);font-size:12px;width:44px;text-align:right}
.bar{flex:0 0 120px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%}
.blk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 8px;border-radius:6px;background:var(--bg-2);font-size:13px}
.blk.info{opacity:.8}
.blk .bt{flex:1;min-width:180px}
.lockbox{border:1px dashed var(--line-2);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center;color:var(--fg-2)}
.brief{border-color:var(--ok)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;align-items:start}
.two>*{min-width:0}
.four{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.four div{border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px;font-size:12.5px;background:var(--bg-2)}
.four b{display:block;font-family:var(--f-mono);font-size:11px;color:var(--accent-2);font-weight:500}
.code-pre{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--bg-2)}
.inbox{display:flex;flex-direction:column;gap:8px}
.msg{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.msg .mh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg .mh b{flex:1;min-width:200px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.clist{display:flex;flex-direction:column;gap:6px}
.clist div{display:flex;gap:9px;align-items:baseline;font-size:13px}
.clist .ck{flex:none;min-width:64px;justify-content:center}
.steps-mini{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.steps-mini .done{color:var(--fg)}
.runsteps{display:flex;flex-direction:column;gap:6px}
.runsteps div{display:flex;gap:9px;align-items:center;font-size:13px;color:var(--muted)}
.runsteps div.done{color:var(--fg-2)}
.verify{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.vbox{border:1px solid var(--ok);background:var(--ok-soft);border-radius:var(--r-sm);padding:11px 12px;display:flex;flex-direction:column;gap:4px}
.vbox.bad{border-color:var(--crit);background:var(--crit-soft)}
.vbox b{font-family:var(--f-display);font-size:14px}
.vbox span{font-size:12.5px;color:var(--fg-2)}
.rp{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.rp.ms{border-color:var(--line-2)}
.rec{font-size:12px;border-left:2px solid var(--warn);padding-left:8px;color:var(--fg-2)}
@media (max-width:1080px){.bp2{grid-template-columns:1fr}.homeB{grid-template-columns:1fr}.homeB .mini{position:static}}
@media (max-width:820px){.steps2{grid-template-columns:1fr}.spine2{position:static;flex-direction:row;flex-wrap:wrap}.ready{grid-template-columns:1fr}.ibody{padding-left:14px}.modeopts{margin-left:0}}

"about.p1":["Prompt Translator turns a rough idea into a complete, reviewed and tested Claude Project setup, and keeps improving it from real results.","Prompt Translator macht aus einer groben Idee ein vollständiges, geprüftes und getestetes Claude-Projekt und verbessert es laufend anhand echter Ergebnisse.","Prompt Translator 能把粗略的想法变成完整的、经过审查与测试的 Claude 项目配置，并根据实际结果持续改进。"],
"about.p2":["What it can promise: no dimension goes unexamined, every assumption is visible, every requirement has a test, and every real failure becomes a new test. What no tool can promise: that nothing will ever go wrong. Simulations catch most problems; real use is the final proof.","Was es versprechen kann: Keine Dimension bleibt ungeprüft, jede Annahme ist sichtbar, jede Anforderung hat einen Test, und jeder echte Fehler wird zu einem neuen Test. Was kein Tool versprechen kann: dass nie etwas schiefgeht. Simulationen fangen die meisten Probleme ab; der echte Einsatz ist der letzte Beweis.","它能保证：每个维度都经过审视，每个假设都清晰可见，每条需求都有测试，每次实际失败都会变成新的测试。任何工具都无法保证：永远不会出错。模拟能发现大部分问题，实际使用才是最终检验。"],
"about.p3":["Every AI step uses your own Claude usage and asks your permission the first time. The tool can't browse the web itself; research runs through a Claude chat and is read back in.","Jeder KI-Schritt nutzt Ihr eigenes Claude-Kontingent und fragt beim ersten Mal um Erlaubnis. Das Tool kann nicht selbst im Web suchen; Recherchen laufen über einen Claude-Chat und werden wieder eingelesen.","每个 AI 步骤都会消耗你自己的 Claude 用量，并在首次使用时征求你的许可。本工具无法自行浏览网页；研究需通过 Claude 对话完成，再导入回来。"],

"help.require":["Each requirement says: given a situation, when something happens, then this must be the result. Each one gets a test.","Jede Anforderung sagt: In einer bestimmten Situation, wenn etwas geschieht, muss dies das Ergebnis sein. Jede erhält einen Test.","每条需求都说明：在某种情况下，当某件事发生时，结果必须是什么。每条需求都配有测试。"],
"help.arch":["The parts of the tool, how they connect, and where it will live. Ordinary code where AI is not needed.","Die Teile des Tools, wie sie zusammenhängen und wo es laufen wird. Normaler Code, wo keine KI nötig ist.","工具由哪些部分组成、各部分如何连接，以及工具放在哪里运行。不需要 AI 的地方就用普通代码。"],
"help.build":["The brief Claude builds from: every part in order, each with its own check. You can read it here; copying unlocks at Launch.","Die Anleitung, nach der Claude baut: alle Teile der Reihe nach, jeder mit eigener Kontrolle. Sie können sie hier lesen; kopieren lässt sie sich erst beim Lancieren.","Claude 依据这份说明进行构建：所有部分按顺序排列，每一部分都有自己的检查。你可以在这里阅读，但要到“上线”步骤才能复制。"],
"help.review":["Independent reviewers look for problems through different lenses. A fix only counts once a separate check confirms it.","Unabhängige Prüfer suchen aus verschiedenen Blickwinkeln nach Problemen. Eine Korrektur zählt erst, wenn eine separate Kontrolle sie bestätigt.","独立审查员从不同角度查找问题。只有经过另一项独立检查确认，修复才算数。"],

"ex.lead":["Paste an existing prompt, project instructions or agent setup, or add files. You get three things: a problem report, a fixed version with minimal changes, and a full rebuild through the normal steps.","Fügen Sie einen bestehenden Prompt, Projektanweisungen oder ein Agenten-Setup ein, oder fügen Sie Dateien hinzu. Sie erhalten drei Dinge: einen Problembericht, eine korrigierte Version mit minimalen Änderungen und einen vollständigen Neuaufbau über die normalen Schritte.","粘贴现有的提示词、项目说明或智能体配置，或者添加文件。你会得到三样东西：一份问题报告、一个改动最少的修正版本，以及按正常步骤完整重建的版本。"], "ex.ph":["Paste the existing work here…","Bestehende Arbeit hier einfügen …","在此粘贴现有成果…"], "ex.files":["Add files (.md, .txt, .json, .pdf)","Dateien hinzufügen (.md, .txt, .json, .pdf)","添加文件（.md、.txt、.json、.pdf）"], "ex.filesn":["{n} files","{n} Dateien","{n} 个文件"], "ex.go":["Check it","Prüfen","开始检查"], "ex.hint":["Before changing anything, PT records how it behaves now. It never removes a section whose purpose is unclear, and keeps hard rules (legal, safety) apart from style.","Bevor etwas geändert wird, hält PT fest, wie es sich jetzt verhält. Es entfernt nie einen Abschnitt, dessen Zweck unklar ist, und hält feste Regeln (Recht, Sicherheit) vom Stil getrennt.","在做任何修改之前，PT 会先记录它目前的表现。用途不明的部分绝不会删除，硬性规则（法律、安全）也会与风格要求分开处理。"], "ex.need":["Paste something or add a file.","Fügen Sie Text ein oder fügen Sie eine Datei hinzu.","请粘贴内容或添加文件。"], "ex.newname":["Check of existing work","Prüfung bestehender Arbeit","现有成果检查"], "ex.reading":["Reading and splitting the existing work…","Bestehende Arbeit wird gelesen und aufgeteilt …","正在读取并拆分现有成果…"], "ex.title":["Check existing work","Bestehende Arbeit prüfen","检查现有成果"], "ex.original":["Original version","Originalversion","原始版本"], "ex.fileerr":["Could not read {f}.","{f} konnte nicht gelesen werden.","无法读取 {f}。"],

"cl.10.added":["Five ways of working per project (Steps, Blueprint, Journey, Swimlanes, Express), Guided or Pro, and two layouts|Release and Operate & update steps with pilot, verified updates and rollback|Readiness to a true 100% with a fix button for everything, and the “Before you can copy” list|One short build line: the build chat reads the brief from PT and writes its report back|Restore points for the whole project (only you delete them) and one file per finished step|Fix · Adjust · Change · Add · Ask on every item, an ask field in every section, and the Guide|Change flags with “Update affected parts only”|Problem lifecycle with independent confirmation, sign-off, accepted risks and audit records|Early checks for Requirements and Architecture; second judge from another model class|Check existing work; background runs for research, pilot, health checks and updates|Automatic model choice with escalation; estimated usage with a budget warning|Workspaces for Owner and Second owner","Fünf Arbeitsweisen pro Projekt (Schritte, Bauplan, Reise, Bahnen, Express), Geführt oder Profi, und zwei Layouts|Schritte Freigabe sowie Betrieb & Updates mit Pilot, überprüften Updates und Zurücksetzen|Bereitschaft bis echte 100 % mit einer Schaltfläche zum Beheben für alles, und die Liste «Bevor Sie kopieren können»|Eine kurze Bauzeile: Der Bau-Chat liest die Anleitung aus PT und schreibt seinen Bericht zurück|Wiederherstellungspunkte für das ganze Projekt (nur Sie löschen sie) und eine Datei pro abgeschlossenem Schritt|Beheben · Anpassen · Ändern · Ergänzen · Fragen bei jedem Element, ein Fragefeld in jedem Abschnitt, und der Guide|Änderungsmarkierungen mit «Nur betroffene Teile aktualisieren»|Ablauf für Probleme mit unabhängiger Bestätigung, Abzeichnen, akzeptierten Risiken und Audit-Protokollen|Frühe Prüfungen für Anforderungen und Architektur; zweiter Bewerter aus einer anderen Modellklasse|Bestehende Arbeit prüfen; Hintergrundläufe für Recherche, Pilot, Zustandsprüfungen und Updates|Automatische Modellwahl mit Stufenaufstieg; geschätzte Nutzung mit Budgetwarnung|Arbeitsbereiche für Owner und Second owner","每个项目五种工作方式（步骤、蓝图、旅程、泳道、快速），可选引导或专业视图，以及两种布局|新增“正式发布”和“运营与更新”步骤，包含试运行、经过验证的更新和回退|就绪度可真正达到 100%，每一项都有修复按钮，并新增“复制前需完成”清单|只需一行简短的构建指令：构建对话从 PT 读取说明，并把报告写回 PT|整个项目的还原点（只有你能删除），每完成一个步骤生成一个文件|每个条目都可修复 · 微调 · 修改 · 补充 · 提问，每个部分都有提问框，还有向导|改动提示，支持“只更新受影响的部分”|问题全流程管理：独立确认、签字确认、已接受的风险和审计记录|需求和架构的早期检查；来自另一类模型的第二评审|检查现有成果；后台运行可用于调研、试运行、健康检查和更新|自动选择模型，结果不理想时自动升级；用量估算及预算提醒|Owner 和 Second owner 各自的工作区"],

  require:"complex", arch:"complex", mockup:"default", build:"complex", mirror:"default", review:"complex", fix:"complex",

function modelFor(step){
  const s = WS.settings || {};

  const auto = STEP_TIER[step] || "default";
  if (o.tier || o.model) return {tier: o.tier || auto, model: o.model || "", effort: o.effort || "", own: true, auto};
  if (s.tier && s.tier !== "auto" && s.tier !== "complex") return {tier: s.tier, model: s.model || "", effort: s.effort || "", own: true, auto};

}
function nextTier(t){ const i = TIER_ORDER.indexOf(t); return i >= 0 && i < TIER_ORDER.length - 1 ? TIER_ORDER[i + 1] : null; }
/* estimated usage: PT can only count its own AI calls and background runs */
function weekKey(d = new Date()){ const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = x.getUTCDay() || 7; x.setUTCDate(x.getUTCDate() + 4 - day); const y = new Date(Date.UTC(x.getUTCFullYear(), 0, 1)); return x.getUTCFullYear() + "-W" + String(Math.ceil(((x - y) / 864e5 + 1) / 7)).padStart(2, "0"); }

  const u = WS.settings.usage = WS.settings.usage || {};
  const k = weekKey(); if (u.week !== k){ u.week = k; u.units = 0; u.warned = false; }
  u.units = (u.units || 0) + units;

async function runAI(key, label, prompt, {json=true, step="default", images=null, quick=false, tier=null, validate=null} = {}){

  if (AI.running.has(key)) return null;
  const ctl = new AbortController();
  const m = quick ? {tier:"quick", model:"", effort:""} : tier ? {tier, model:"", effort:""} : modelFor(step);
  const job = {ctl, text:"", label, started: Date.now(), tier: m.tier, step};

      if (curTier) opts.modelTier = curTier;

      if (m.effort && m.model && tries === 1) opts.effort = m.effort;
      if (images && images.length) opts.images = images;

function readinessScore(p){

/** everything unfinished from all steps; blocking items lock copying */
/** blocking items outside the 12 readiness checks: open questions, unconfirmed items, open concerns */
function beforeCopyExtra(p){
  const out = [];

  for (const i of assumedItems(p).filter(i => !["dim","ns"].includes(i.kind) && i.kind !== "assumption")) out.push({block:true, step:i.ph, ref:i.ref, text: t("bl.assumed") + ": " + trunc(i.title, 100), fix:"item-confirm", go:i.ph});

}
function beforeCopy(p){
  const out = [];
  for (const r of readiness10(p)) for (const b of r.blockers) out.push(Object.assign({block:true, step: b.go || r.ph, group: r.key}, b));
  out.push(...beforeCopyExtra(p));
  const unsorted = WS.notes.filter(n => n.projectId === p.id && n.inbox && !n.deletedAt).length;
  if (unsorted) out.push({block:false, step:"capture", ref:"notes", text: t("bl.notes", {n: unsorted}), fix:"open-notes", go:""});

/* ---------- restore points (only the person deletes them) ---------- */
function projSnapshot(p){
  const s = clone(p); delete s._images; delete s.restore;
  let body = JSON.stringify(s);
  // restore points are full copies (the Store splits big ones); only very old test outputs are shortened in huge projects
  if (body.length > 900000){ for (const r of arr(s.runs).slice(3)) for (const x of arr(r.results)) x.output = trunc(x.output, 600); body = JSON.stringify(s); }
  return {s, body};
}
function addRestore(p, {kind = "auto", label = "", step = "", source = null} = {}){
  if (!p || !WS.id) return null;
  const {s, body} = projSnapshot(source || p);
  const h = hashStr(body);
  p.restore = arr(p.restore);
  const last = p.restore[p.restore.length - 1];
  if (last && last.h === h){
    // nothing changed since the last restore point: keep one copy and add this label to it
    if (kind !== "auto"){ last.milestone = true; last.kind = last.kind === "auto" ? kind : last.kind; if (label && !str(last.label).includes(label)) last.label = trunc((last.label ? last.label + " · " : "") + label, 200); }
    return null;
  }
  const r = {id: uid("rp"), at: now(), kind, label: str(label), step: step || (p.focus && p.focus.ph) || p.phase, h, size: body.length, milestone: kind !== "auto", draft: p.versionNo || 0};
  p.restore.push(r);
  Store.put(projPath(p.id) + "/restore/" + r.id, {meta: r, project: s});
  return r;
}
async function loadRestore(p, rid){ try{ return await Store.get(projPath(p.id) + "/restore/" + rid); }catch(e){ return null; } }
/** Claude's recommendations: never deletes, only suggests with a reason */
function restoreAdvice(p){
  const RP = arr(p.restore), out = {};
  for (let i = 0; i < RP.length - 1; i++) if (RP[i].h === RP[i + 1].h) out[RP[i].id] = t("rp.rec.same");
  for (let i = 0; i < RP.length; i++){
    const r = RP[i]; if (r.milestone || out[r.id]) continue;
    const day = r.at.slice(0, 10);
    if (RP.slice(i + 1).some(x => x.milestone && x.at.slice(0, 10) === day)) out[r.id] = t("rp.rec.milestone");
  }
  if (storageEstimate().pct >= 70) for (const r of RP.filter(x => !x.milestone).slice(0, 20)) out[r.id] = out[r.id] || t("rp.rec.storage");
  return out;
}
function storageEstimate(){
  let n = 2 + WS.notes.length + WS.patterns.length + WS.research.length + arr(WS.jobs).length;
  for (const p of WS.projects) n += 1 + (p.versionNo || 0) + arr(p.restore).length;
  n *= Math.max(1, META.workspaces.length) / 1;   /* rough: other workspaces assumed similar */
  return {n: Math.round(n), pct: Math.min(100, Math.round(n / 25000 * 100))};
}

/* ---------- finishing a step: milestone + one file per finished step ---------- */
function stepFileName(p, ph){
  const d = new Date(), pad = n => String(n).padStart(2, "0");
  const stamp = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "_" + pad(d.getHours()) + "-" + pad(d.getMinutes());
  const name = String(p.name || "project").normalize("NFKD").replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-+|-+$/g, "").slice(0, 50) || "project";
  const idx = pad(PHASE_IDS.indexOf(ph) + 1);
  const who = String(wsLabel(WS.name)).replace(/[^\p{L}\p{N}]+/gu, "-");
  return `${name}_${stamp}_draft${pad(p.versionNo || 0)}_${idx}-${PHASE_EN[ph] || ph}_${who}.json`;
}
const STEP_THR = {capture:.9, understand:.5, interview:.8, assume:.6, require:.8, arch:.9, build:.95, review:.9, test:.7, launch:1, release:1, operate:2};
function stepDone(p, ph){ return phaseProgress10(p)[ph] >= STEP_THR[ph]; }
function finishStep(p, ph){
  p.step = p.step || {};
  if (p.step[ph] && p.step[ph].done) return;
  if (!stepDone(p, ph)) return;
  p.step[ph] = {done: true, at: now()};
  addRestore(p, {kind: "step", label: t("rp.stepdone", {s: phName(ph)}), step: ph});
  logAct(p, t("act.stepdone", {s: phName(ph)}), {step: ph, important: true});
  if (WS.settings.fileOnFinish !== false){
    const data = JSON.stringify({app:"prompt-translator", version: PT_VERSION, exportedAt: now(), step: ph, projects:[projSnapshot(p).s]}, null, 1);
    setTimeout(() => saveFile(stepFileName(p, ph), data), 200);
  }
}

/* ---------- releases of built tools: v1.0 → v1.0.1 (fix) → v1.1 (change) → v2.0 (big) ---------- */
function nextRelease(p, kind){
  const cur = p.releases.length ? p.releases[0].v : null;
  if (!cur) return "1.0";
  const [a, b, c] = cur.split(".").map(x => num(x, 0));
  if (kind === "big") return (a + 1) + ".0";
  if (kind === "fix") return a + "." + b + "." + ((c || 0) + 1);
  return a + "." + (b + 1);
}
function releaseKind(changes){ const ks = arr(changes).map(c => c.k); if (ks.includes("big")) return "big"; if (ks.some(k => k === "change" || k === "add" || k === "remove")) return "change"; return "fix"; }

/* ===================== AI TASKS & DETERMINISTIC ENGINES ===================== */
const STATUS3 = ["unknown","assumed","confirmed"];
const ACAT = ["value","usability","viability","feasibility","gtm","legal"];
function oneOf(v, list, d){ return list.includes(v) ? v : d; }
function conf(v){ return oneOf(v, ["high","medium","low"], "medium"); }

/* ---------- 1. Clarify intake ---------- */
async function aiClarify(p){
  const raw = str(p.intake.raw).trim();
  if (!raw){ toast(t("cap.needraw"), "err"); return; }
  const prompt = buildPrompt("clarify", {
    rules:["golden","elicit","assume"],
    context: projectContext(p),
    body:`The person dumped a raw idea (in <raw_idea>). Turn it into a clean, unambiguous restatement that keeps every intention they expressed and invents nothing. Then extract a North Star, and list contradictions, unclear points and missing information that matter for building the solution. For each missing item say briefly why it matters. Mark how confident you are in the restatement.`,
    schema:`{"clean":"restated idea, 3-10 sentences","northStar":{"problem":"","goal":"","success":"measurable success measure or empty if unknown","users":"","constraints":"","now":"current state"},"contradictions":["…"],"ambiguities":["…"],"missing":[{"item":"…","why":"…"}],"confidence":"high|medium|low"}`
  });

}

/* ---------- 2. Understand ---------- */
async function aiUnderstand(p, kind){
  const bodies = {

    jtbd:`State the job to be done: "When [situation], I want to [motivation], so I can [expected outcome]." Then list functional, emotional and social parts of the job.`,
    reframe:`Offer 4 genuinely different reframings of the problem (for example a narrower problem, a broader one, a problem behind the problem, and a non-AI reading). For each, say what would be built differently.`,
    walkthrough:`Narrate a realistic day-in-the-life of the finished solution in use, step by step with times (the "Ablauf"), from trigger to the person acting on the result. Then list the steps or decisions this walkthrough revealed as missing or undecided.`,
    premortem:`Run a pre-mortem: it is six months after launch and the solution failed. List 8 specific reasons it failed, each with likelihood (1-5), impact (1-5) and a mitigation.`,
    devil:`Act as a respectful devil's advocate. Give the strongest honest arguments that this plan is wrong or not worth building, and what evidence would settle each point.`
  };
  const schemas = {
    whys:`{"whys":[{"q":"Why …?","a":"…","guess":true}],"rootNeed":"…"}`,

    reframe:`{"reframes":[{"text":"…","differently":"…"}]}`,
    walkthrough:`{"walkthrough":[{"time":"07:00","step":"…"}],"gaps":["…"]}`,
    premortem:`{"failures":[{"text":"…","likelihood":3,"impact":4,"mitigation":"…"}]}`,
    devil:`{"arguments":[{"point":"…","evidence":"what would settle it"}]}`
  };
  const prompt = buildPrompt("understand-" + kind, {rules:["assume","funnel","simple"], platform:true, context: projectContext(p), body: bodies[kind], schema: schemas[kind]});
  const r = await runAI("und-" + kind, t("und.running"), prompt, {step:"understand"});
  if (!r) return;
  snapshot(p);
  const u = p.understand;
  if (kind === "whys"){ u.whys = arr(r.whys).map(w => ({q:str(w.q), a:str(w.a), guess:!!w.guess})); u.rootNeed = str(r.rootNeed); }
  if (kind === "jtbd"){ u.jtbd = str(r.jtbd); u.jtbdParts = {functional:arr(r.functional).map(str), emotional:arr(r.emotional).map(str), social:arr(r.social).map(str)}; }
  if (kind === "reframe"){ u.reframes = arr(r.reframes).map(x => ({id:uid("rf"), text:str(x.text), differently:str(x.differently), chosen:false})); }
  if (kind === "walkthrough"){ u.walkSteps = arr(r.walkthrough).map(s => ({time:str(s.time), step:str(s.step)})); u.walkthrough = u.walkSteps.map(s => s.time + " " + s.step).join("\n"); u.walkGaps = arr(r.gaps).map(str); }
  if (kind === "premortem"){

    for (const f of u.premortem){ if (!p.risks.some(x => x.text === f.text)) p.risks.push({id:uid("rk"), text:f.text, likelihood:f.likelihood, impact:f.impact, mitigation:f.mitigation, status:"open", source:"premortem"}); }

/* ---------- 7. Review (red team) ---------- */
async function aiReview(p, lensIds, {onlySections = null} = {}){
  const secs = arr(p.pkg.sections).filter(s => !onlySections || onlySections.includes(s.id));
  if (!secs.length){ toast(t("rev.needpkg"), "err"); return; }
  let added = 0, reopened = 0, n = 0, ran = 0;
  const known = p.findings.filter(f => OPEN_F.includes(f.status) || f.status === "accepted").map(f => "- [" + f.status + "] " + f.section + ": " + trunc(f.issue, 160)).join("\n");
  for (const lid of lensIds){
    const lens = LENSES.find(l => l.id === lid); if (!lens) continue;
    const prompt = buildPrompt("review-" + lid, {
      role:`You are an independent reviewer who did NOT write this package. Your only job is to find real problems through one lens: ${lens.en}. You are rigorous and fair: report only issues that matter, never pad the list, and say so when the package is sound.`,
      rules: null, platform:true, context: projectContext(p),
      body:`Lens: ${lens.en}. Focus: ${lens.ai}\n${known ? "\nThese problems are already known (do not report them again; only report new ones):\n" + known + "\n" : ""}\n<package target_model="${esc(p.pkg.targetModel || "")}">\n${JSON.stringify(secs.map(s => ({id:s.id, dest:s.dest, title:s.title, cadence:s.cadence, content:s.content}))).slice(0, 50000)}\n</package>\n\nReport findings with severity (critical | high | medium | low), the section id and a short quote of where, the issue, and a concrete fix (exact replacement text when possible). Maximum 8 findings.`,
      schema:`{"findings":[{"severity":"high","section":"instructions","where":"short quote","issue":"…","fix":"…"}],"verdict":"one sentence overall assessment"}`
    });
    n++;
    const r = await runAI("review", t("rev.running", {lens: L(lens)}) + " (" + n + "/" + lensIds.length + ")", prompt, {step:"review"});
    if (!r) break;
    ran++;
    p.reviewVerdicts = p.reviewVerdicts || {}; p.reviewVerdicts[lid] = str(r.verdict);
    for (const f of arr(r.findings)){
      const issue = str(f.issue), sec = str(f.section);
      /* a problem that comes back is reopened, not counted as new */
      if (p.findings.some(x => (OPEN_F.includes(x.status) || x.status === "accepted") && x.section === sec && similar(x.issue, issue))) continue;
      const prev = p.findings.find(x => x.status === "done" && x.section === sec && similar(x.issue, issue));
      if (prev){ prev.status = "open"; prev.reopened = (prev.reopened || 0) + 1; prev.audit = arr(prev.audit); prev.audit.push({at: now(), what: t("aud.reopened"), by: t("aud.reviewer")}); reopened++; continue; }
      p.findings.push({id:uid("fd"), lens:lid, severity:oneOf(f.severity, ["critical","high","medium","low"], "medium"), section:sec, where:str(f.where), issue, fix:str(f.fix), status:"open", version:p.versionNo, at:now(), audit:[{at: now(), what: t("aud.found"), by: t("aud.reviewer")}], reopened:0, stage: onlySections ? "recheck" : "review"});
      added++;
    }
    touch(p);
  }
  // the seal needs a complete review: every lens ran and answered, on the whole package
  const complete = ran === lensIds.length;
  if (complete && !onlySections && LENSES.every(l => lensIds.includes(l.id))){ p.reviewedVersion = p.versionNo; p.seal.review = p.versionNo; }
  logAct(p, t("act.review", {n: added, r: reopened}), {step:"review", important: added > 0});
  toast(t("rev.done", {n: added}) + (reopened ? " · " + t("rev.reopened", {n: reopened}) : ""), "ok"); render();
  return complete;
}
async function aiApplyFixes(p, ids){
  const fs = p.findings.filter(f => ids.includes(f.id) && f.status === "open" && f.section !== "" && f.stage !== "early");
  if (!fs.length) return;
  const secs = p.pkg.sections;
  const prompt = buildPrompt("applyfix", {
    rules:["golden","why","positive","short","calm"], userLang:true,
    body:`Apply these review fixes to the package. Change only what each fix requires; keep everything else identical. Keep package content in English.\n\n<fixes>\n${JSON.stringify(fs.map(f => ({id:f.id, section:f.section, where:f.where, issue:f.issue, fix:f.fix})))}\n</fixes>\n\n<package>\n${JSON.stringify(secs.map(s => ({id:s.id, content:s.content}))).slice(0, 60000)}\n</package>`,
    schema:`{"sections":[{"id":"only sections you changed","content":"full new content"}],"applied":["finding ids applied"],"summary":"one sentence describing the changes, in the person's language"}`
  });
  const r = await runAI("fix", t("rev.fixing"), prompt, {step:"fix", validate: o => arr(o.sections).length > 0});
  if (!r) return;
  snapshot(p, t("rp.before", {x: t("rev.apply", {n: fs.length})}));
  const before = {};
  for (const s of arr(r.sections)){ const cur = secs.find(x => x.id === s.id); if (cur && str(s.content) && cur.content !== str(s.content)){ before[cur.id] = cur.content; cur.content = str(s.content); cur.mirror = ""; } }
  const changedIds = Object.keys(before);
  const applied = arr(r.applied).map(str).filter(id => fs.some(f => f.id === id));
  let moved = 0;
  for (const f of fs){
    /* a finding moves to "waiting for confirmation" only when its section really changed; an independent reviewer then confirms it */
    const changed = changedIds.includes(f.section);
    if (changed && (applied.includes(f.id) || !arr(r.applied).length)){
      f.status = "waiting"; f.fixedAt = now(); f.before = trunc(before[f.section], 6000); f.after = trunc(secs.find(x => x.id === f.section).content, 6000);
      f.audit = arr(f.audit); f.audit.push({at: now(), what: t("aud.fixed") + (r.summary ? ": " + str(r.summary) : ""), by: t("aud.fixer")}); moved++;
    } else { f.audit = arr(f.audit); f.audit.push({at: now(), what: t("aud.notapplied"), by: t("aud.fixer")}); }
  }
  if (changedIds.length){ saveVersion(p, str(r.summary) || t("ver.fixes")); changedIds.forEach(id => markDownstream(p, "section:" + id)); }
  logAct(p, t("act.fixed", {n: moved, m: fs.length - moved}), {step:"review", important:true});
  if (moved < fs.length) toast(t("rev.notall", {n: fs.length - moved}), "err");
  touch(p); render();
  if (moved) await aiConfirmFixes(p, fs.filter(f => f.status === "waiting").map(f => f.id));
}

/* ---------- 8. Tests, simulation, judging ---------- */
async function aiTests(p){
  const prompt = buildPrompt("tests", {
    rules:["evals","overfit","trifecta"], platform:true, context: projectContext(p),
    body:`Create a test set for this solution: 8-14 cases across categories normal, edge, adversarial (including prompt-injection inside data), empty-or-broken input, and wrong-language input. Each case: the situation/input given to the agent, simulated tool or data results the agent would see (so the run can be simulated without the internet), the requirement ids it checks, and 2-4 pass criteria that a reviewer can judge yes/no from the output alone. Mark about a quarter of the cases as heldOut=true; those are kept back to check improvements honestly.`,
    schema:`{"tests":[{"title":"…","category":"normal|edge|adversarial|empty|language","input":"…","simulated":"tool/data results the agent sees","reqIds":["R1"],"criteria":["…"],"heldOut":false}]}`
  });
  const r = await runAI("tests", t("test.generating"), prompt, {step:"test"});
  if (!r) return;
  snapshot(p);
  const start = p.tests.length;
  arr(r.tests).forEach((x, i) => p.tests.push({id:"T" + (start + i + 1), title:str(x.title), category:oneOf(x.category, ["normal","edge","adversarial","empty","language"], "normal"), input:str(x.input), simulated:str(x.simulated), reqIds:arr(x.reqIds).map(str), criteria:arr(x.criteria).map(str).filter(Boolean), heldOut:!!x.heldOut}));
  touch(p); render();
}
function agentTranscriptPrompt(p, test, sections){
  const instr = sections.filter(s => s.dest === "instructions").map(s => s.content).join("\n\n");
  const know = sections.filter(s => s.dest === "knowledge").map(s => `<file name="${esc(s.filename || s.title)}">\n${trunc(s.content, 6000)}\n</file>`).join("\n");
  const sched = sections.filter(s => s.dest === "scheduled" || s.dest === "subagent").map(s => `<${s.dest} title="${esc(s.title)}">\n${trunc(s.content, 4000)}\n</${s.dest}>`).join("\n");
  return `[[task:simulate]]
You are now the AI agent configured by the setup below, running inside a Claude Project. Behave exactly as this setup makes you behave — follow its instructions, including their gaps and flaws; do not fix or improve them. You have no live internet in this simulation: wherever you would call a tool or search, use the simulated results provided, and mark anything you would have to invent as [SIMULATED].

<project_instructions>
${instr}
</project_instructions>
<project_knowledge>
${know}
</project_knowledge>
${sched ? "<task_prompts>\n" + sched + "\n</task_prompts>" : ""}

<simulated_tool_results>
${test.simulated || "(none)"}
</simulated_tool_results>

<user_or_trigger>
${test.input}
</user_or_trigger>

Produce exactly the output the agent would deliver.`;
}
async function aiRunTests(p, {ids=null, trials=1, versionLabel=null, sections=null} = {}){
  const secs = sections || p.pkg.sections;
  if (!arr(secs).length){ toast(t("rev.needpkg"), "err"); return null; }
  const list = p.tests.filter(x => !ids || ids.includes(x.id));
  if (!list.length){ toast(t("test.none"), "err"); return null; }
  const run = {id:uid("run"), versionNo: versionLabel ?? p.versionNo, at:now(), trials, results:[], label: versionLabel != null ? String(versionLabel) : ""};
  if (versionLabel == null) snapshot(p, t("rp.before", {x: t("test.run")}));
  let i = 0;
  for (const test of list){
    for (let k = 0; k < trials; k++){
      i++;
      const out = await runAI("sim", t("test.simulating", {i, n: list.length * trials, id: test.id}), agentTranscriptPrompt(p, test, secs), {json:false, step:"test"});
      if (out == null){ p.runs.unshift(run); finishRun(p, run); return run; }
      const judgePrompt = `[[task:judge]]
You are an impartial grader. Judge the AGENT OUTPUT below against each criterion separately. Grade only substance: ignore length, formatting and writing style, and do not reward an answer for being longer. If the output does not give enough evidence for a criterion, answer "unknown". Be strict and literal.

<test_input>
${test.input}
</test_input>
<agent_output>
${trunc(out, 20000)}
</agent_output>
<criteria>
${test.criteria.map((c, j) => (j + 1) + ". " + c).join("\n")}
</criteria>

Write each reason in ${langName(LANG)}.
Reply with only JSON: {"verdicts":[{"criterion":1,"verdict":"pass|fail|unknown","reason":"one sentence"}]}`;
      const jr = await runAI("judge", t("test.judging", {id: test.id}), judgePrompt, {step:"judge"});   // judge 1: complex class; judge 2 below: a different class
      const verdicts = arr(jr && jr.verdicts).map(v => ({c: num(v.criterion, 0), v: oneOf(v.verdict, ["pass","fail","unknown"], "unknown"), reason: str(v.reason)}));
      const pass = verdicts.length > 0 && verdicts.every(v => v.v === "pass");
      /* second judge from a different model class; disagreement goes to the person */
      let judge2 = null;
      if (versionLabel == null){
        const j2 = await runAI("judge2", t("test.judging2", {id: test.id}), judgePrompt.replace("[[task:judge]]", "[[task:judge2]]"), {step:"judge2", tier: "default"});
        const v2 = arr(j2 && j2.verdicts); if (v2.length) judge2 = v2.every(v => v.verdict === "pass") ? "pass" : "fail";
      }
      run.results.push({testId:test.id, trial:k, output: trunc(out, 3000), verdicts, pass, judge2, heldOut: !!test.heldOut, category: test.category});
    }
  }
  p.runs.unshift(run); finishRun(p, run);
  const covered = !ids || p.tests.every(x => ids.includes(x.id));
  if (versionLabel == null && covered && run.results.length === list.length * trials){ p.seal.test = p.versionNo; }
  if (versionLabel == null) for (const id of [...new Set(run.results.map(r => r.testId))]) unflag(p, "test:" + id);
  logAct(p, t("act.tests", {r: run.passRate, n: list.length, k: trials}), {step:"test", important:true});
  return run;
}
function finishRun(p, run){
  const tests = [...new Set(run.results.map(r => r.testId))];
  const pr = run.results.length ? run.results.filter(r => r.pass).length / run.results.length : 0;
  const consistent = tests.length ? tests.filter(id => run.results.filter(r => r.testId === id).every(r => r.pass)).length / tests.length : 0;
  run.passRate = Math.round(pr * 100); run.consistency = Math.round(consistent * 100);
  p.runs = p.runs.slice(0, 6);
  const v = arr(p.versions).find(x => x.no === run.versionNo); if (v){ v.passRate = run.passRate; v.consistency = run.consistency; }
  touch(p); render();
}
async function aiImprove(p){
  const last = p.runs[0];
  if (!last){ toast(t("test.runfirst"), "err"); return; }
  const fails = last.results.filter(r => !r.pass && !r.heldOut).slice(0, 8);
  if (!fails.length){ toast(t("test.nofails"), "ok"); return; }
  const failText = fails.map(f => { const tc = p.tests.find(x => x.id === f.testId) || {}; return `<failure test="${f.testId}">\nInput: ${trunc(tc.input, 600)}\nCriteria: ${arr(tc.criteria).join(" | ")}\nVerdicts: ${f.verdicts.map(v => v.c + ":" + v.v + " " + v.reason).join(" | ")}\nOutput excerpt: ${trunc(f.output, 1200)}\n</failure>`; }).join("\n");
  const prompt = buildPrompt("improve", {
    rules:["golden","why","positive","short","calm","overfit"], userLang:true,
    body:`Improve the package so these failures are fixed in a general way — not by special-casing the test inputs. Diagnose the cause of each failure first, then rewrite only what is needed. Prefer shorter, clearer text over adding rules. Keep content in English.\n\n${failText}\n\n<package>\n${JSON.stringify(p.pkg.sections.map(s => ({id:s.id, dest:s.dest, content:s.content}))).slice(0, 50000)}\n</package>`,
    schema:`{"diagnosis":["cause per failure, in the person's language"],"sections":[{"id":"only changed sections","content":"full new content"}],"summary":"one sentence, in the person's language"}`
  });
  const r = await runAI("improve", t("test.improving"), prompt, {step:"improve"});
  if (!r) return;
  const cand = clone(p.pkg.sections);
  for (const s of arr(r.sections)){ const c = cand.find(x => x.id === s.id); if (c && str(s.content)){ c.content = str(s.content); c.mirror = ""; } }
  p.candidate = {sections: cand, diagnosis: arr(r.diagnosis).map(str), summary: str(r.summary), at: now()};
  touch(p); render();
  // honest check on held-out + failed cases
  const held = p.tests.filter(x => x.heldOut).map(x => x.id);
  const failedIds = fails.map(f => f.testId);
  const ids = [...new Set([...failedIds, ...held])];
  const candRun = await aiRunTests(p, {ids, trials:1, versionLabel: "candidate", sections: cand});
  if (candRun){ p.candidate.passRate = candRun.passRate; p.candidate.runId = candRun.id; touch(p); render(); }
}

function parseResearch(text){
  const m = String(text).match(/```json\s*([\s\S]*?)```/i);
