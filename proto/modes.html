<title>Prompt Translator Modes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout concept: Prompt Translator's mission-control shell (rail + one work surface) with a prototype control strip on top. Five "maps" share one detail card system, one focus marker and one readiness gate. Dark-first, light mirrors it. */
:root{
  --bg:#0a0e16; --bg-2:#0e1420; --surface:#121a29; --surface-2:#172134; --line:#223049; --line-2:#2c3c5a;
  --fg:#e7edf7; --fg-2:#b5c0d3; --muted:#8392ab;
  --accent:#5aa2ff; --accent-2:#8fc1ff; --accent-ink:#06101f; --accent-soft:rgba(90,162,255,.13);
  --proto:#b48cff; --proto-soft:rgba(180,140,255,.12);
  --ok:#3fcf8e; --ok-soft:rgba(63,207,142,.13); --warn:#f2b84b; --warn-soft:rgba(242,184,75,.14); --crit:#ff6b6b; --crit-soft:rgba(255,107,107,.13);
  --as:#d9a3ff; --as-soft:rgba(217,163,255,.13);
  --glow:0 0 0 1px rgba(90,162,255,.35),0 0 24px rgba(90,162,255,.12);
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --f-display:"Chakra Petch","IBM Plex Sans","Noto Sans SC",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --r-sm:7px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f3f5f9; --bg-2:#eaeef5; --surface:#ffffff; --surface-2:#f6f8fc; --line:#d9e0eb; --line-2:#c5cfdf;
  --fg:#0d1626; --fg-2:#334058; --muted:#5f6c84;
  --accent:#1f5fd1; --accent-2:#174aa6; --accent-ink:#ffffff; --accent-soft:rgba(31,95,209,.09);
  --proto:#6b3fd1; --proto-soft:rgba(107,63,209,.08);
  --ok:#11845a; --ok-soft:rgba(17,132,90,.10); --warn:#a86a00; --warn-soft:rgba(200,130,0,.11); --crit:#c2302f; --crit-soft:rgba(194,48,47,.09);
  --as:#8a3fc0; --as-soft:rgba(138,63,192,.09);
  --glow:0 0 0 1px rgba(31,95,209,.35),0 0 18px rgba(31,95,209,.10);
  --shadow:0 10px 30px rgba(20,35,70,.12);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#f3f5f9; --bg-2:#eaeef5; --surface:#ffffff; --surface-2:#f6f8fc; --line:#d9e0eb; --line-2:#c5cfdf;
  --fg:#0d1626; --fg-2:#334058; --muted:#5f6c84;
  --accent:#1f5fd1; --accent-2:#174aa6; --accent-ink:#ffffff; --accent-soft:rgba(31,95,209,.09);
  --proto:#6b3fd1; --proto-soft:rgba(107,63,209,.08);
  --ok:#11845a; --ok-soft:rgba(17,132,90,.10); --warn:#a86a00; --warn-soft:rgba(200,130,0,.11); --crit:#c2302f; --crit-soft:rgba(194,48,47,.09);
  --as:#8a3fc0; --as-soft:rgba(138,63,192,.09);
  --glow:0 0 0 1px rgba(31,95,209,.35),0 0 18px rgba(31,95,209,.10);
  --shadow:0 10px 30px rgba(20,35,70,.12);
  color-scheme:light;
}
:root[data-theme="dark"]{color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:22px}h2{font-size:18px}h3{font-size:15px}h4{font-size:13px}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:12px}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
svg.ic{width:16px;height:16px;flex:none}

/* Prototype strip */
.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg-2);border-bottom:1px solid var(--proto);display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg-2)}
.proto-tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--proto);background:var(--proto-soft);border:1px solid var(--proto);border-radius:999px;padding:2px 9px}
.pgroup{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.plabel{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 10px;font-size:12.5px;cursor:pointer;color:var(--fg-2);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg);font-weight:600}
.seg.proto-seg button[aria-pressed="true"]{background:var(--proto-soft)}

/* Shell */
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:calc(100% - 50px)}
.rail{background:var(--bg-2);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;gap:10px;align-items:center}
.brand-mark{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#7b5cff);color:#fff;font-family:var(--f-display);font-weight:700;font-size:13px;flex:none}
.brand-name{font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1.1}
.brand-sub{font-size:11px;color:var(--muted)}
.ws{border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;background:var(--surface);font-size:12.5px}
.ws b{display:block;font-size:13px}
.navlist{display:flex;flex-direction:column;gap:4px}
.navitem{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:var(--r-sm);padding:8px 9px;cursor:pointer;color:var(--fg-2)}
.navitem:hover{background:var(--surface)}
.navitem[aria-current="true"]{background:var(--surface);border-color:var(--line-2);color:var(--fg)}
.navitem small{display:block;color:var(--muted);font-size:11.5px}
.main{min-width:0;padding-block:20px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:900px){.main{padding-left:28px;padding-right:28px}}

/* Buttons & chips */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface-2);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;align-self:flex-start;color:var(--fg)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--fg)}
.btn.danger{border-color:var(--crit);color:var(--crit);background:var(--crit-soft)}
.btn.ghost{background:none;border-color:transparent;color:var(--fg-2)}
.btn.ghost:hover{border-color:var(--line-2)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.lg{padding:11px 18px;font-size:14.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-2);border-radius:999px;padding:1px 8px;font-size:11.5px;color:var(--fg-2);white-space:nowrap;background:var(--surface)}
.chip.model{font-family:var(--f-mono);font-size:10.5px;color:var(--accent-2);border-color:rgba(90,162,255,.4)}
.chip.st-ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.chip.st-as{color:var(--as);border-color:var(--as);background:var(--as-soft)}
.chip.st-bad{color:var(--crit);border-color:var(--crit);background:var(--crit-soft)}
.chip.st-warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.chip.st-todo{color:var(--muted)}
.chip.part{cursor:pointer}
.chip.part:hover{border-color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted);display:inline-block}
.dot.ok{background:var(--ok)}.dot.as{background:var(--as)}.dot.bad{background:var(--crit)}.dot.warn{background:var(--warn)}.dot.todo{background:transparent;border:1.5px solid var(--line-2)}.dot.cur{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.eyebrow{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* Project header */
.phead{display:flex;flex-direction:column;gap:12px}
.ptitle{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.ns{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--surface);border-radius:var(--r-sm);padding:9px 12px;font-size:13.5px;color:var(--fg-2);max-width:880px}
.ns b{color:var(--fg);font-weight:600}
.modebar{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.modebtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 11px;cursor:pointer;min-width:0;text-align:left;position:relative;flex:1 1 140px;max-width:230px}
.modebtn:hover{border-color:var(--line-2)}
.modebtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:var(--glow)}
.modebtn .mname{display:flex;gap:7px;align-items:center;font-family:var(--f-display);font-weight:600;font-size:13.5px}
.modebtn .mdesc{font-size:11.5px;color:var(--muted);line-height:1.35}
.modebtn .sug{position:absolute;top:-8px;right:8px;font-size:10px;background:var(--bg);border:1px solid var(--ok);color:var(--ok);border-radius:999px;padding:0 6px}

/* Banners & guide */
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid var(--as);background:var(--as-soft);border-radius:var(--r-sm);padding:9px 12px;font-size:13px}
.banner.info{border-color:var(--line-2);background:var(--surface)}
.guide{border:1px solid var(--accent);background:linear-gradient(180deg,var(--accent-soft),transparent);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.guide .where{font-size:12px;color:var(--muted)}
.guide .what{font-size:15.5px;font-weight:600}
.guide p{color:var(--fg-2);max-width:70ch}

/* Item rows */
.items{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.item+.item{border-top:1px solid var(--line)}
.ihead{display:flex;gap:10px;align-items:center;padding:9px 12px;cursor:pointer;width:100%;text-align:left;background:none;border:0}
.ihead:hover{background:var(--surface-2)}
.iid{font-family:var(--f-mono);font-size:11px;color:var(--muted);flex:none;width:28px}
.ititle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.open .ititle{white-space:normal}
.ibody{padding:4px 14px 14px 49px;display:flex;flex-direction:column;gap:10px}
.item.open{background:var(--surface-2)}
.item[data-focus] {box-shadow:inset 3px 0 0 var(--accent)}
.gwt{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13.5px}
.gwt b{font-family:var(--f-mono);font-size:11px;color:var(--accent-2);font-weight:500;padding-top:2px;text-transform:uppercase}
.answer{border-left:2px solid var(--line-2);padding-left:10px;color:var(--fg)}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.askbox{display:flex;flex-direction:column;gap:8px;border:1px dashed var(--line-2);border-radius:var(--r-sm);padding:10px;background:var(--bg-2)}
.askbox textarea{width:100%;min-height:58px;resize:vertical;background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:8px}
.proposal{border:1px solid var(--ok);background:var(--ok-soft);border-radius:var(--r-sm);padding:10px;display:flex;flex-direction:column;gap:8px}
.spin{width:13px;height:13px;border:2px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* Steps mode */
.steps{display:grid;grid-template-columns:210px minmax(0,1fr);gap:16px;align-items:start}
.spine{display:flex;flex-direction:column;gap:2px;position:sticky;top:64px}
.spine button{display:flex;gap:9px;align-items:center;border:0;background:none;padding:6px 8px;border-radius:6px;cursor:pointer;text-align:left;color:var(--fg-2);font-size:13px}
.spine button:hover{background:var(--surface)}
.spine button[aria-current="true"]{background:var(--surface);color:var(--fg);font-weight:600}
.stepcard{display:flex;flex-direction:column;gap:14px}
.stephead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

/* Blueprint */
.bp>*,.homeB>*,.two>*,.steps>*{min-width:0}
.bp{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,1fr);gap:16px;align-items:start}
.mapwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--bg-2);padding:8px}
.mapwrap svg{display:block;min-width:520px;width:100%;height:auto}
.node{cursor:pointer}
.node rect.box{fill:var(--surface);stroke:var(--line-2);stroke-width:1.2}
.node:hover rect.box{stroke:var(--accent)}
.node.sel rect.box{stroke:var(--accent);stroke-width:2.4}
.node.lnk rect.box{stroke:var(--accent-2);stroke-dasharray:4 3;stroke-width:1.8}
.node.dim{opacity:.28}
.node.hit rect.box{stroke:var(--warn);stroke-width:2.4;fill:var(--warn-soft)}
.node text{fill:var(--fg)}
.node text.k{fill:var(--muted);font-size:10.5px}
.edge{fill:none;stroke:var(--line-2);stroke-width:1.4}
.edge.dim{opacity:.25}
.arrowhead{fill:var(--line-2)}
.strip{display:flex;gap:4px;flex-wrap:wrap}
.strip button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--fg-2)}
.strip button[aria-current="true"]{border-color:var(--accent);color:var(--fg)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}

/* Journey */
.journey{overflow-x:auto;padding:6px 2px 4px}
.stations{display:grid;grid-template-columns:repeat(12,minmax(64px,1fr));min-width:780px;position:relative}
.stations::before{content:"";position:absolute;left:4%;right:4%;top:15px;height:2px;background:var(--line-2)}
.station{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;position:relative;padding:0 2px;color:var(--fg-2);font-size:11.5px;text-align:center;line-height:1.25}
.station .ring{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:2px solid var(--line-2);font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.station.done .ring{border-color:var(--ok);color:var(--ok)}
.station.attn .ring{border-color:var(--as);color:var(--as)}
.station.cur .ring{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 5px var(--accent-soft)}
.station.sel span{color:var(--fg);font-weight:600}
.here{font-size:10px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:7px;cursor:pointer;text-align:left;color:var(--fg)}
.tile:hover{border-color:var(--line-2)}
.tile.sel{border-color:var(--accent);box-shadow:var(--glow)}
.tile .tn{display:flex;justify-content:space-between;gap:6px;align-items:center;font-family:var(--f-display);font-weight:600;font-size:13.5px}
.tile .tc{display:flex;gap:6px;flex-wrap:wrap}
.tile .tnext{font-size:12px;color:var(--fg-2)}
.meter{height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}

/* Swimlanes */
.lanes{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--bg-2)}
.lgrid{display:grid;min-width:760px}
.lgrid .lh{font-size:11px;color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--line);font-family:var(--f-mono)}
.lgrid .ln{padding:10px;border-top:1px solid var(--line);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;background:var(--surface)}
.lgrid .lc{padding:8px 6px;border-top:1px solid var(--line);border-left:1px dashed var(--line);display:flex;flex-direction:column;gap:6px;min-height:52px}
.lpart{border:1px solid var(--line-2);background:var(--surface);border-radius:7px;padding:6px 8px;font-size:12px;cursor:pointer;text-align:left;display:flex;gap:6px;align-items:center;color:var(--fg)}
.lpart:hover{border-color:var(--accent)}
.lpart.sel{border-color:var(--accent);box-shadow:var(--glow)}
.lpart.hit{border-color:var(--warn);background:var(--warn-soft)}
.lpart.dim{opacity:.3}
.cmap{display:flex;flex-direction:column;gap:10px}
.cbtn{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:7px 11px;font-size:12.5px;cursor:pointer;text-align:left;color:var(--fg)}
.cbtn[aria-pressed="true"]{border-color:var(--warn);background:var(--warn-soft)}

/* Express */
.xp{display:flex;flex-direction:column;gap:12px;max-width:860px}
.bubble{border-radius:12px;padding:11px 14px;max-width:640px;font-size:14px}
.bubble.you{align-self:flex-end;background:var(--accent-soft);border:1px solid rgba(90,162,255,.35)}
.bubble.ai{background:var(--surface);border:1px solid var(--line)}
.xcard{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);overflow:hidden}
.xcard>header{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.xcard .items{border:0;border-radius:0}
.xnext{border:1px dashed var(--line-2);border-radius:var(--r);padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;color:var(--fg-2)}

/* Layout B */
.homeB{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:16px;align-items:start}
.homeB .mini{position:sticky;top:64px;display:flex;flex-direction:column;gap:8px}
.homeB .mini .mapwrap svg{min-width:0}

/* Launch, release, operate */
.ready{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ringbig{width:112px;height:112px}
.chk{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.chk.full{opacity:.8}
.chkhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chkhead .nm{flex:1;min-width:160px;font-weight:500}
.score{font-family:var(--f-mono);font-size:12px;width:44px;text-align:right}
.bar{flex:0 0 120px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%}
.blk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 8px;border-radius:6px;background:var(--bg-2);font-size:13px}
.blk .bt{flex:1;min-width:180px}
.lock{border:1px dashed var(--line-2);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center;color:var(--fg-2)}
.brief{border:1px solid var(--ok);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.four{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.four div{border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px;font-size:12.5px;background:var(--bg-2)}
.four b{display:block;font-family:var(--f-mono);font-size:11px;color:var(--accent-2);font-weight:500}
pre.code{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;max-height:280px;overflow:auto;white-space:pre-wrap;font-family:var(--f-mono);font-size:12px;line-height:1.5;margin:0}
.runsteps{display:flex;flex-direction:column;gap:6px}
.runsteps div{display:flex;gap:9px;align-items:center;font-size:13px;color:var(--muted)}
.runsteps div.on{color:var(--fg)}
.runsteps div.done{color:var(--fg-2)}
.verify{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.vbox{border:1px solid var(--ok);background:var(--ok-soft);border-radius:var(--r-sm);padding:11px 12px;display:flex;flex-direction:column;gap:4px}
.vbox b{font-family:var(--f-display);font-size:14px}
.vbox span{font-size:12.5px;color:var(--fg-2)}
.inbox{display:flex;flex-direction:column;gap:8px}
.msg{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.msg .mh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg .mh b{flex:1;min-width:200px;font-weight:600}
.clist{display:flex;flex-direction:column;gap:6px}
.clist div{display:flex;gap:9px;align-items:baseline;font-size:13px}
.clist .ck{font-family:var(--f-mono);font-size:10.5px;padding:1px 6px;border-radius:4px;border:1px solid var(--line-2);flex:none;width:62px;text-align:center}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}

/* Drawer / modal / toast */
.scrim{position:fixed;inset:0;background:rgba(5,8,14,.55);z-index:40;display:flex;justify-content:flex-end}
.drawer{width:min(460px,100%);height:100%;background:var(--bg-2);border-left:1px solid var(--line);padding:18px;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-right:max(18px,env(safe-area-inset-right,0px));overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.scrim.center{justify-content:center;align-items:flex-start;padding:40px 16px;overflow-y:auto}
.modal{width:min(860px,100%);background:var(--bg-2);border:1px solid var(--line-2);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.modal textarea{width:100%;min-height:110px;font-size:15px;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:12px;resize:vertical}
.mcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mcard{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px;display:flex;flex-direction:column;gap:5px;cursor:pointer;text-align:left;color:var(--fg);position:relative}
.mcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:var(--glow)}
.mcard small{color:var(--muted);font-size:11.5px;line-height:1.35}
.rp{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.rp .fn{font-family:var(--f-mono);font-size:11.5px;word-break:break-all}
.rec{font-size:12px;border-left:2px solid var(--warn);padding-left:8px;color:var(--fg-2)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--surface-2);border:1px solid var(--accent);border-radius:10px;padding:10px 16px;box-shadow:var(--shadow);font-size:13.5px;max-width:min(560px,calc(100% - 32px))}
.totop{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20}
.pulse{animation:pl 1.6s ease-out 1}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(90,162,255,.7)}100%{box-shadow:0 0 0 14px rgba(90,162,255,0)}}
@media (prefers-reduced-motion: reduce){.pulse,.spin{animation:none}}

@media (max-width:1080px){.bp{grid-template-columns:1fr}.homeB{grid-template-columns:1fr}.homeB .mini{position:static}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;align-items:center}
  .navlist{flex-direction:row;flex-wrap:wrap}
  .steps{grid-template-columns:1fr}
  .spine{position:static;flex-direction:row;flex-wrap:wrap}
  .ready{grid-template-columns:1fr}
  .ibody{padding-left:14px}
}

}

function checks(){
  const p = P(), its = p.items, rel = (kind, id, x) => ({kind, id, x});
  const L = [];
  const add = (key, pen, bl) => L.push({key, bl, score: Math.max(0, Math.round(10 - pen * bl.length))});
  add("c_ns", 10, p.ns ? [] : [rel("notyet")]);
  add("c_q", 1, its.filter(i => i.ph === "interview" && i.st === "assumed").map(i => rel("confirm", i.id, i.body)));
  add("c_asm", 2, its.filter(i => i.ph === "assume" && i.st !== "ok").map(i => rel("confirm", i.id, i.title)));
  add("c_req", 2, its.filter(i => i.ph === "require" && i.st === "assumed").map(i => rel("confirm", i.id, i.title)));
  const tests = its.filter(i => i.ph === "test");
  const reqs = its.filter(i => i.ph === "require");
  add("c_cov", 1, tests.length ? reqs.filter(r => !tests.some(x => x.req === r.id)).map(r => rel("addtest", r.id, r.title)) : [rel("notyet")]);
  const rv = its.filter(i => i.ph === "review");
  add("c_find", 1.5, rv.length ? rv.filter(f => f.st === "open").map(f => rel("fix", f.id, f.title)).concat(rv.filter(f => f.st === "fixed").map(f => rel("recheck", f.id, f.title))) : [rel("notyet")]);
  add("c_test", 2, tests.length ? tests.filter(x => x.st === "fail").map(x => rel("rerun", x.id, x.title)) : [rel("notyet")]);
  add("c_brief", 10, its.some(i => i.ph === "build") ? [] : [rel("notyet")]);
  add("c_judge", 10, rv.length ? [] : [rel("notyet")]);
  add("c_cost", 10, []);
  L.forEach(c => { if (c.bl.some(b => b.kind === "notyet")) c.score = 0; });
  const score = Math.round(L.reduce((s, c) => s + c.score, 0));
  const left = L.reduce((s, c) => s + c.bl.filter(b => b.kind !== "notyet").length, 0);
  return {list:L, score, left};
}

  if (a.state === "done") return `<div class="proposal"><b>${a.k === "ask" ? t("ask") : t("proposal")}</b><p>${a.k === "ask" ? t("answer_text") : t("prop_text",{id:i.id, parts:i.parts.join(", ") || "—"})}</p>${a.k === "ask" ? `<div class="row"><button class="btn sm" data-a="askclose">${t("close")}</button></div>` : `<div class="row"><button class="btn sm ok" data-a="accept" data-v="${i.id}">${t("accept")}</button><button class="btn sm ghost" data-a="askclose">${t("discard")}</button></div>`}</div>`;
  return `<div class="askbox"><label class="muted" for="askta" style="font-size:12px">${t(a.k)}</label><textarea id="askta" placeholder="${esc(t("ask_ph_" + a.k))}"></textarea><div class="row"><button class="btn sm pri" data-a="asksend">${t("send")}</button>${S.guided ? "" : modelChip(a.k === "ask" ? "Haiku · low" : "Sonnet · medium")}<button class="btn sm ghost" data-a="askclose">${t("cancel")}</button></div></div>`;

function phaseBody(ph){
  if (ph === "launch") return launchScreen();

  const its = phItems(ph);

/* ============ mode: Steps ============ */

/* ============ mode: Blueprint ============ */
function mapSVG(compact){
  const p = P(), W = compact ? 156 : 196, H = compact ? 70 : 86, bw = compact ? 140 : 172, bh = compact ? 50 : 56;
  const pos = id => { const q = part(id); return {x: 12 + q.x * W, y: 12 + q.y * H}; };
  const rows = Math.max(...p.parts.map(q => q.y)) + 1;
  const vw = 12 + 3 * W, vh = 12 + rows * H;
  const f = p.focus.id ? item(p.focus.id) : null;
  const linked = S.selPart ? [S.selPart] : (f ? f.parts : []);
  const cm = S.cm ? p.changes.find(c => c.id === S.cm) : null;
  const edges = p.edges.map(([a,b]) => {
    const A = pos(a), B = pos(b);
    let d;
    if (B.y > A.y) d = `M${A.x+bw/2},${A.y+bh} C${A.x+bw/2},${A.y+bh+22} ${B.x+bw/2},${B.y-22} ${B.x+bw/2},${B.y-3}`;
    else { const sx = A.x + (B.x >= A.x ? bw : 0), tx = B.x + (B.x >= A.x ? 0 : bw); const ox = B.x >= A.x ? 1 : -1; d = `M${sx},${A.y+bh/2} C${sx+40*ox},${A.y+bh/2} ${tx-40*ox},${B.y+bh/2} ${tx-3*ox},${B.y+bh/2}`; }
    const dim = cm && !(cm.parts.includes(a) && cm.parts.includes(b));
    return `<path class="edge ${dim ? "dim" : ""}" d="${d}" marker-end="url(#ah)"/>`;
  }).join("");
  const nodes = p.parts.map(q => {
    const {x,y} = pos(q.id), s = partState(q.id);
    const col = {ok:"var(--ok)",as:"var(--as)",bad:"var(--crit)",warn:"var(--warn)"}[s];
    const its = p.items.filter(i => i.parts.includes(q.id)), c = counts(its);
    const cls = [S.selPart === q.id ? "sel" : (linked.includes(q.id) ? "lnk" : ""), cm ? (cm.parts.includes(q.id) ? "hit" : "dim") : ""].join(" ");
    const sub = t("k_" + q.kind) + (q.model && !S.guided ? " · " + q.model : q.note ? " · " + q.note : "");
    const badges = [["bad",c.bad,"var(--crit)"],["warn",c.warn,"var(--warn)"],["as",c.as,"var(--as)"]].filter(b => b[1]).map((b,k) => `<g transform="translate(${bw-14-k*22},${bh-14})"><circle r="8" fill="${b[2]}"/><text text-anchor="middle" y="3.5" font-size="10" style="fill:var(--bg);font-weight:700">${b[1]}</text></g>`).join("");
    return `<g class="node ${cls}" data-a="selpart" data-v="${q.id}" transform="translate(${x},${y})" tabindex="0" role="button" aria-label="${esc(q.name)}">
      <rect class="box" width="${bw}" height="${bh}" rx="9"/><rect width="4" height="${bh-16}" x="0" y="8" rx="2" fill="${col}"/>
      ${compact ? `<text x="14" y="${bh/2+6}" font-size="15" font-weight="600">${esc(trunc(q.name, /[\u4e00-\u9fff]/.test(q.name) ? 7 : 14))}</text>` : `<text x="14" y="23" font-size="13" font-weight="600">${esc(trunc(q.name,22))}</text>
      <text class="k" x="14" y="41">${esc(trunc(sub,30))}</text>`}${badges}</g>`;
  }).join("");
  return `<svg viewBox="0 0 ${vw} ${vh}" role="img" aria-label="Blueprint"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker></defs>${edges}${nodes}</svg>`;
}
function legend(){ return `<div class="legend"><span><span class="dot ok"></span>${t("legend_ok")}</span><span><span class="dot as"></span>${t("legend_as")}</span><span><span class="dot bad"></span>${t("legend_bad")}</span></div>`; }
function strip(){ const p = P(); return `<div class="strip">${ORDER.map(o => { const s = phaseState(o); return `<button data-a="phase" data-v="${o}" aria-current="${o === p.focus.ph}"><span class="dot ${s === "done" ? "ok" : s === "attn" ? "as" : s === "cur" ? "cur" : "todo"}"></span>${phn(o)}</button>`; }).join("")}</div>`; }
function partPanel(pid){

}

/* ============ mode: Journey ============ */
function modeJourney(){

  const st = ORDER.map((o, k) => { const s = phaseState(o); return `<button class="station ${s} ${o === f.ph ? "sel" : ""}" data-a="phase" data-v="${o}">${o === p.phase ? `<span class="here">${t("youhere")}</span>` : `<span class="here" style="visibility:hidden">·</span>`}<span class="ring">${s === "done" ? "✓" : k+1}</span><span>${phn(o)}</span></button>`; }).join("");

    else { const first = its.find(i => sc(i.st) !== "ok"); nx = first ? t("tile_next",{x:(first.st === "assumed" ? t("confirm") : first.st === "fail" ? t("rerun") : first.st === "fixed" ? t("recheck") : t("fix")) + " · " + first.title}) : (its.length ? t("ph_done") : t("ph_todo")); }
    const pct = o === "launch" ? ck.score : Math.round(c.ok / tot * 100);

     <span class="meter"><i style="width:${its.length || o === "launch" ? pct : 0}%;background:${s === "cur" ? "var(--accent)" : "var(--ok)"}"></i></span>
     <span class="tc">${its.length ? `<span class="chip">${t("n_items",{n:its.length})}</span>` : ""}${c.as ? `<span class="chip st-as">${c.as} ${t("st_assumed")}</span>` : ""}${c.bad ? `<span class="chip st-bad">${c.bad} ${t("st_open")}</span>` : ""}${c.warn ? `<span class="chip st-warn">${c.warn}</span>` : ""}</span>
     <span class="tnext">${esc(nx)}</span></button>`;
  }).join("");
  return `<div class="stack"><div class="journey"><div class="stations">${st}</div></div><div class="tiles">${tiles}</div>
   <section class="card stack"><div class="eyebrow">${t("ph_" + phaseState(f.ph))}</div><h2>${phn(f.ph)}</h2>${S.guided ? "" : `<p class="muted">${PHHELP[f.ph][LI()]}</p>`}${phaseBody(f.ph)}</section>
   ${S.selPart ? partPanel(S.selPart) : ""}</div>`;
}

/* ============ mode: Swimlanes + change map ============ */
function modeSwimlanes(){
  const p = P(), f = p.focus, it = f.id ? item(f.id) : null;
  const lanes = LANES.filter(l => p.parts.some(q => q.kind === l));
  const n = Math.max(...p.parts.map(q => q.seq));
  const cm = S.cm ? p.changes.find(c => c.id === S.cm) : null;
  const hl = S.selPart ? [S.selPart] : (it ? it.parts : []);
  let g = `<div class="lgrid" style="grid-template-columns:110px repeat(${n},minmax(118px,1fr))"><div class="lh"></div>${Array.from({length:n},(_,k) => `<div class="lh">${t("flowstep",{n:k+1})}</div>`).join("")}`;
  lanes.forEach(l => {
    g += `<div class="ln">${t("lane_" + l)}</div>`;
    for (let k = 1; k <= n; k++){
      const ps = p.parts.filter(q => q.kind === l && q.seq === k);
      g += `<div class="lc">${ps.map(q => `<button class="lpart ${hl.includes(q.id) ? "sel" : ""} ${cm ? (cm.parts.includes(q.id) ? "hit" : "dim") : ""}" data-a="selpart" data-v="${q.id}" ${hl[0] === q.id ? "data-focus" : ""}><span class="dot ${partState(q.id)}"></span>${esc(q.name)}</button>`).join("")}</div>`;
    }
  });
  g += `</div>`;
  const cmPanel = `<div class="card cmap"><div class="row" style="justify-content:space-between"><h3>${t("changemap")}</h3>${cm ? `<button class="btn sm ghost" data-a="cm" data-v="">${t("cancel")}</button>` : ""}</div><p class="muted" style="font-size:12.5px">${t("cm_hint")}</p>
    <div class="row">${p.changes.map(c => `<button class="cbtn" data-a="cm" data-v="${c.id}" aria-pressed="${S.cm === c.id}">${esc(c.name)}</button>`).join("")}</div>
    ${cm ? `<div class="stack" style="gap:6px"><div>${t("cm_aff",{p:cm.parts.map(x => (S.guided ? "" : x + " ") + part(x).name).join(", ")})}</div>${cm.items.length && !S.guided ? `<div class="muted">${t("linked")}: ${cm.items.join(", ")}</div>` : ""}${cm.tests.length ? `<div class="muted">${t("cm_tests",{t:cm.tests.join(", ")})}</div>` : ""}<div class="muted">${t("cm_untouched",{n:p.parts.length - cm.parts.length})}</div><button class="btn sm pri" data-a="toast" data-v="added_plan">${t("cm_addplan")}</button></div>` : `<p class="muted">${t("cm_none")}</p>`}</div>`;
  return `<div class="stack">${strip()}<div class="lanes">${g}</div>${cmPanel}${S.selPart ? partPanel(S.selPart) : `<section class="card stack"><div class="eyebrow">${t("ph_" + phaseState(f.ph))}</div><h2>${phn(f.ph)}</h2>${phaseBody(f.ph)}</section>`}</div>`;
}

/* ============ Launch ============ */
function ring(score){
  const r = 46, c = 2 * Math.PI * r, col = score === 100 ? "var(--ok)" : "var(--warn)";
  return `<svg class="ringbig" viewBox="0 0 112 112" role="img" aria-label="${score}%"><circle cx="56" cy="56" r="${r}" fill="none" stroke="var(--line)" stroke-width="9"/><circle cx="56" cy="56" r="${r}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c*score/100} ${c}" transform="rotate(-90 56 56)"/><text x="56" y="62" text-anchor="middle" font-size="22" font-weight="600" style="fill:var(--fg);font-family:var(--f-display)">${score}%</text></svg>`;
}
function launchScreen(){

      const btn = busy ? `<span class="row muted"><span class="spin"></span>${t("fixing")}</span>` : `<button class="btn sm pri" data-a="${b.kind === "fix" ? "fixitem" : b.kind}" data-v="${b.id}">${b.kind === "confirm" ? t("confirm") : b.kind === "fix" ? t("fix") : b.kind === "recheck" ? t("recheck") : b.kind === "rerun" ? t("rerun") : t("addtest")}</button>`;
      return `<div class="blk" ${p.focus.id === b.id ? "data-focus" : ""}><span class="bt">${esc(txt)}</span>${btn}${S.guided ? "" : ["adjust","change","add"].map(k => `<button class="btn sm ghost" data-a="askjump" data-v="${b.id}" data-k="${k}">${t(k)}</button>`).join("")}</div>`;
    }).join("");
    return `<div class="chk ${c.score === 10 ? "full" : ""}"><div class="chkhead"><span class="dot ${c.score === 10 ? "ok" : c.score >= 8 ? "warn" : "bad"}"></span><span class="nm">${t(c.key)}</span><span class="bar"><i style="width:${c.score*10}%;background:${col}"></i></span><span class="score tnum">${c.score}/10</span></div>${bl}</div>`;

  const head = `<div class="ready">${ring(ck.score)}<div class="stack"><h3>${t("l_title")}</h3><p class="muted">${t("l_sub")}</p>${ck.left ? `<div class="row"><button class="btn pri" data-a="fixall">${t("l_fixall",{n:ck.left})}</button>${S.guided ? "" : modelChip("Sonnet · medium")}<button class="btn" data-a="walk">${t("l_walk")}</button></div>` : ""}</div></div>`;

  return `<div class="stack">${head}${rows}${brief}</div>`;
}

   <div class="four"><div><b>${t("s1")}</b>${t("s1d")}</div><div><b>${t("s2")}</b>${t("s2d")}</div><div><b>${t("s3")}</b>${t("s3d")}</div><div><b>${t("s4")}</b>${t("s4d")}</div></div>
   <pre class="code" id="brieftext">${esc(briefText())}</pre>
   <div class="row"><button class="btn pri lg" data-a="copy">${ic("copy")} ${t("copy")}</button>${S.copied ? `<span class="chip st-ok">${t("copied",{f:fn})}</span>` : ""}<button class="btn" data-a="phase" data-v="release">${t("to_release")} →</button></div></div>`;
}

/* ============ Release ============ */
function releaseScreen(){
  const p = P(), ck = checks();
  if (p.version) return `<div class="stack"><div class="vbox"><b>v${p.version}</b><span>${t("r_done")}</span></div></div>`;
  if (ck.score < 100) return `<div class="lock">${ic("lock")}<span>${t("r_locked")}</span></div>`;
  const steps = S.rel === 1 ? `<div class="row muted"><span class="spin"></span>${t("fixing")}</div>` : "";
  return `<div class="stack"><h3>${t("r_title")}</h3><p class="muted" style="max-width:70ch">${t("r_sub")}</p>
   ${S.rel === 0 ? `<textarea id="relta" class="askbox" style="min-height:90px;width:100%" placeholder="${esc(t("r_paste"))}">${esc(S.relText)}</textarea><div class="row"><button class="btn" data-a="relex">${t("r_example")}</button><button class="btn pri" data-a="relcheck">${t("r_check")}</button></div>` : ""}
   ${steps}
   ${S.rel >= 2 ? `<div class="vbox"><b>Pilot</b><span>${t("r_ok")}</span></div>` : ""}
   ${S.rel === 2 ? `<button class="btn pri lg" data-a="promote">${t("r_promote")}</button>` : ""}
   ${S.rel === 3 ? `<div class="vbox"><b>v1.0</b><span>${t("r_done")}</span></div>` : ""}</div>`;
}

/* ============ Operate & update ============ */
function operateScreen(){
  const p = P();
  if (!p.version && S.rel < 3) return `<p class="muted" style="max-width:70ch">${t("o_notlive")}</p>`;
  if (!p.inbox) return `<p class="muted">${t("o_status",{v:"1.0"})}</p>`;
  const inbox = p.inbox.map(m => `<div class="msg"><div class="mh"><span class="chip">${t(m.src)}</span><b>${esc(m.title)}</b><span class="chip ${m.on ? "st-ok" : ""}">${m.on ? t("o_in") : t("o_out")}</span></div><p class="muted" style="font-size:13px">${esc(m.body)}</p><div class="row">${m.runrec ? `<span class="chip">${t("o_runrec")}</span>` : ""}${m.links ? `<span class="chip st-ok">${ic("check")} ${t("o_links")}</span>` : ""}${m.src === "o_research" ? `<span class="muted" style="font-size:12px">${t("o_never")}</span>` : ""}${S.guided ? "" : m.parts.map(x => `<span class="chip part" data-a="selpart" data-v="${x}">${x}</span>`).join("")}${m.chg ? `<button class="btn sm ghost" data-a="inbox" data-v="${m.id}">${m.on ? t("o_toggle_out") : t("o_toggle_in")}</button>` : ""}</div></div>`).join("");
  const on = p.inbox.filter(m => m.on).map(m => m.id);
  const cl = p.clist.filter(c => !c.from || on.includes(c.from));
  const kcol = {Fix:"st-bad",Change:"st-warn",Remove:"st-todo"};
  const stepsTxt = t("o_steps",{a:p.version}).split("|");
  let upd;
  if (S.upd.state === "plan") upd = `<div class="card stack"><div class="row" style="justify-content:space-between"><h3>${t("o_plan",{a:p.version,b:p.next})}</h3>${modelChip("Opus · high")}</div><p class="muted" style="font-size:12.5px">${t("o_plan_sub")}</p><div class="eyebrow">${t("o_changes")}</div><div class="clist">${cl.map(c => `<div><span class="ck chip ${kcol[c.k]}">${c.k}</span><span>${esc(c.x)}${S.guided ? "" : ` <span class="muted mono">${c.parts.join(" ")}</span>`}</span></div>`).join("")}</div><div class="muted">${t("cm_untouched",{n:p.parts.length - new Set(cl.flatMap(c => c.parts)).size})}</div><button class="btn pri lg" data-a="runupd" ${cl.length ? "" : "disabled"}>${t("o_run")}</button></div>`;
  else if (S.upd.state === "running") upd = `<div class="card stack"><h3>${t("o_plan",{a:p.version,b:p.next})}</h3><div class="runsteps">${stepsTxt.map((s, k) => `<div class="${k < S.upd.step ? "done" : k === S.upd.step ? "on" : ""}">${k < S.upd.step ? `<span style="color:var(--ok)">${ic("check")}</span>` : k === S.upd.step ? `<span class="spin"></span>` : `<span class="dot todo"></span>`}${esc(s)}</div>`).join("")}</div></div>`;
  else upd = `<div class="card stack" data-focus><h3>${t("o_done",{b:p.next})}</h3><div class="verify"><div class="vbox"><b>✓ ${t("v_lost")}</b><span>${t("v_lost_d")}</span></div><div class="vbox"><b>✓ ${t("v_gaps")}</b><span>${t("v_gaps_d")}</span></div><div class="vbox"><b>✓ ${t("v_fossil")}</b><span>${t("v_fossil_d")}</span></div><div class="vbox"><b>✓ ${t("v_issues")}</b><span>${t("v_issues_d")}</span></div></div>
    <div class="eyebrow">${t("o_whatsnew",{b:p.next})}</div><div class="clist">${cl.map(c => `<div><span class="ck chip ${kcol[c.k]}">${c.k}</span><span>${esc(c.x)}</span></div>`).join("")}</div>
    <p class="muted mono">invoice-reminder_2026-10-19_v1.1-release · invoice-reminder_2026-10-19_before-update-v1.1</p>
    <div class="row"><button class="btn danger" data-a="toast" data-v="o_rb_ask">${t("o_rollback",{a:p.version})}</button><button class="btn ghost" data-a="updreset">${t("o_again")}</button></div></div>`;
  return `<div class="stack"><div class="row"><span class="dot ok"></span><span>${t("o_status",{v:p.version})}</span></div><div class="two"><div class="stack"><h3>${t("o_inbox")} <span class="chip">${p.inbox.length}</span></h3><div class="inbox">${inbox}</div></div><div class="stack">${upd}</div></div></div>`;
}

/* ============ layer: drawer, modal, toast ============ */
function renderLayer(){
  let h = "";
  if (S.drawer === "restore"){
    const p = P();
    h += `<div class="scrim" data-a="closelayer"><aside class="drawer" data-stop role="dialog" aria-label="${esc(t("rp_title"))}"><div class="row" style="justify-content:space-between"><h2>${t("rp_title")}</h2><button class="btn sm ghost" data-a="closelayer">${t("close")}</button></div><p class="muted">${t("rp_sub")}</p>
     ${p.restore.length ? p.restore.slice().reverse().map(r => `<div class="rp"><span class="fn">${esc(r.f)}</span><span class="muted" style="font-size:12px">${esc(r.d)}</span>${r.rec ? `<div class="rec">${esc(t("rp_rec",{why:r.rec}))}</div>` : ""}<div class="row"><button class="btn sm" data-a="toast" data-v="rp_restored">${t("rp_restore")}</button>${S.rpConfirm === r.f ? `<button class="btn sm danger" data-a="rpdel" data-v="${esc(r.f)}">${t("rp_confirm")}</button><button class="btn sm ghost" data-a="rpcancel">${t("cancel")}</button>` : `<button class="btn sm ghost" data-a="rpask" data-v="${esc(r.f)}">${t("rp_delete")}</button>`}</div></div>`).join("") : `<p class="muted">${t("rp_none")}</p>`}</aside></div>`;
  }
  if (S.modal === "new"){
    const def = S.prefs[S.person].def, sel = S.np.mode || def;
    h += `<div class="scrim center" data-a="closelayer"><div class="modal" data-stop role="dialog" aria-label="${esc(t("np_title"))}"><div class="row" style="justify-content:space-between"><h2>${t("np_title")}</h2><button class="btn sm ghost" data-a="closelayer">${t("close")}</button></div>
     <label for="npta" class="muted">${t("np_idea")}</label><textarea id="npta"></textarea>
     <div class="muted">${t("np_mode")}</div>
     <div class="mcards">${MODES.map(m => `<button class="mcard" data-a="npmode" data-v="${m}" aria-pressed="${sel === m}">${m === "express" ? `<span class="chip st-ok" style="align-self:flex-start">${t("np_sug")}</span>` : ""}${m === def ? `<span class="chip" style="align-self:flex-start">${t("np_default")}</span>` : ""}<b class="row">${ic(m)} ${t("m_" + m)}</b><small>${t("g_" + m)}</small></button>`).join("")}</div>
     <div class="row"><div class="seg">${[["true",t("guided")],["false",t("pro")]].map(([v,l]) => `<button data-a="set" data-k="guided" data-v="${v}" aria-pressed="${String(S.guided) === v}">${l}</button>`).join("")}</div><button class="btn pri lg" data-a="npstart">${t("np_start")}</button></div></div></div>`;
  }
  if (S.toast) h += `<div class="toast" role="status">${esc(S.toast)}</div>`;
  document.getElementById("layer").innerHTML = h;
}
let toastTimer;
function toast(msg){ S.toast = msg; renderLayer(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; renderLayer(); }, 3600); }

/* ============ actions ============ */
const wait = ms => new Promise(r => setTimeout(r, ms));
async function doFix(id){
  const it = item(id); if (!it || S.busy) return;
  S.busy = id; render(); await wait(700);
  if (it.st === "open"){ it.st = "fixed"; render(); await wait(600); it.st = "confirmed"; toast(t("fixed_toast",{id})); }
  else if (it.st === "fixed"){ it.st = "confirmed"; toast(t("fixed_toast",{id})); }
  else if (it.st === "fail"){ it.st = "pass"; toast(t("fixed_toast",{id})); }
  else if (it.st === "assumed"){ it.st = "ok"; toast(t("confirmed_toast",{id})); }
  S.busy = null; render();
}
async function addTest(rid){
  const p = P(); S.busy = rid; render(); await wait(700);
  const n = "T" + (p.items.filter(i => i.ph === "test").length + 1);
  const r = item(rid);
  p.items.push({id:n, ph:"test", title:"Run failure shows on page (" + rid + ")", req:rid, st:"pass", parts:r.parts.slice()});
  S.busy = null; toast(t("test_added",{id:n})); render();
}
async function fixAll(){
  const ck = checks();
  for (const c of ck.list) for (const b of c.bl){
    if (b.kind === "notyet") continue;
    P().focus.id = b.id;
    if (b.kind === "addtest") await addTest(b.id); else await doFix(b.id);
  }
  P().focus.id = null; render();
}
function setFocus(ph, id){ const p = P(); p.focus = {ph, id: id || null}; S.selPart = null; S.ask = null; }

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  if (el.dataset.a === "closelayer" && e.target.closest("[data-stop]") && el.closest("[data-stop]") === null) return;
  const a = el.dataset.a, v = el.dataset.v, p = P();
  switch (a){
    case "set": {
      const k = el.dataset.k; let val = v === "true" ? true : v === "false" ? false : v;
      if (k === "person"){ S.prefs[S.person].lang = S.lang; S.prefs[S.person].guided = S.guided; S.person = val; S.lang = S.prefs[val].lang; S.guided = S.prefs[val].guided; S.selPart = null; S.cm = null; S.prevMode = null; S.ask = null; }
      else S[k] = val;
      render(); break; }
    case "theme": { const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark"; render(); break; }
    case "proj": S.cur[S.person] = v; S.selPart = null; S.cm = null; S.prevMode = null; S.ask = null; S.copied = false; render(); break;
    case "mode": if (p.mode === v) break; S.prevMode = p.mode; p.mode = v; S.pulse = true; render(); toast(t("switched",{mode:t("m_" + v), where:whereLabel()})); break;
    case "phase": setFocus(v, null); S.pulse = true; render(); break;
    case "focus": setFocus(el.dataset.ph, v); S.open[v] = true; S.pulse = true; render(); break;
    case "item": { if (p.focus.id === v){ p.focus.id = null; S.open[v] = false; } else { p.focus = {ph: item(v).ph, id: v}; } S.ask = null; render(); break; }
    case "selpart": e.stopPropagation(); S.selPart = S.selPart === v ? null : v; S.pulse = true; render(); break;
    case "clearsel": S.selPart = null; S.pulse = true; render(); break;
    case "confirm": { const it = item(v); it.st = "ok"; toast(t("confirmed_toast",{id:v})); render(); break; }
    case "confirmall": phItems(v).forEach(i => { if (i.st === "assumed") i.st = "ok"; }); toast(t("confirmed_toast",{id:phn(v)})); render(); break;
    case "fixitem": case "recheck": case "rerun": p.focus.id = p.focus.ph === "launch" ? v : p.focus.id; await doFix(v); break;
    case "addtest": await addTest(v); break;
    case "fixall": await fixAll(); break;
    case "walk": { const ck = checks(); const b = ck.list.flatMap(c => c.bl).find(b => b.kind !== "notyet"); if (b){ const it = item(b.id); setFocus(it.ph, it.id); S.open[it.id] = true; S.pulse = true; render(); } break; }
    case "ask": S.ask = {id:v, k:el.dataset.k, state:"edit"}; render(); setTimeout(() => document.getElementById("askta")?.focus(), 30); break;
    case "askjump": { const it = item(v); setFocus(it.ph, it.id); S.ask = {id:v, k:el.dataset.k, state:"edit"}; S.pulse = true; render(); break; }
    case "asksend": S.ask.state = "busy"; render(); await wait(800); if (S.ask){ S.ask.state = "done"; render(); } break;
    case "askclose": S.ask = null; render(); break;
    case "accept": { const it = item(v); if (it.st === "assumed") it.st = "ok"; S.ask = null; toast(t("confirmed_toast",{id:v})); render(); break; }
    case "copy": {
      const txt = briefText(); try { await navigator.clipboard.writeText(txt); } catch(_) { const pre = document.getElementById("brieftext"); if (pre){ const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } }
      S.copied = true; render(); break; }
    case "relex": S.relText = "BUILD REPORT · Idea Scout v1.0\nParts built: 9/9 (P1–P9)\nChecks: 8/8 passed\nDry run: Monday scan → 10 candidates → 3 write-ups → page OK\nCould not do: nothing"; render(); break;
    case "relcheck": S.relText = document.getElementById("relta")?.value || S.relText; S.rel = 1; render(); await wait(1100); S.rel = 2; render(); break;
    case "promote": S.rel = 3; p.restore.push({f:"idea-scout_2026-10-19_v1.0-release", d:"19 Oct"}); render(); break;
    case "inbox": { const m = p.inbox.find(x => x.id === v); m.on = !m.on; render(); break; }
    case "runupd": { S.upd = {state:"running", step:0}; render(); const n = t("o_steps",{a:p.version}).split("|").length; for (let k = 0; k < n; k++){ S.upd.step = k; render(); await wait(520); } S.upd.state = "done"; S.pulse = true; render(); break; }
    case "updreset": S.upd = {state:"plan", step:0}; render(); break;
    case "cm": S.cm = v || null; render(); break;
    case "toast": toast(t(v)); break;
    case "drawer": S.drawer = v; S.rpConfirm = null; renderLayer(); break;
    case "new": S.modal = "new"; S.np.mode = null; renderLayer(); setTimeout(() => document.getElementById("npta")?.focus(), 30); break;
    case "npmode": S.np.mode = v; renderLayer(); break;
    case "npstart": { const m = S.np.mode || S.prefs[S.person].def; S.modal = null; renderLayer(); toast(t("np_started",{mode:t("m_" + m)})); break; }
    case "closelayer": if (e.target === el || el.tagName === "BUTTON"){ S.drawer = null; S.modal = null; renderLayer(); } break;
    case "rpask": S.rpConfirm = v; renderLayer(); break;
    case "rpcancel": S.rpConfirm = null; renderLayer(); break;
    case "rpdel": p.restore = p.restore.filter(r => r.f !== v); S.rpConfirm = null; renderLayer(); toast(t("rp_deleted")); break;
    case "top": window.scrollTo({top:0, behavior:"smooth"}); document.getElementById("main")?.scrollTo?.({top:0}); break;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && (S.drawer || S.modal)){ S.drawer = null; S.modal = null; renderLayer(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("g.node")){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", {bubbles:true})); }
});
render();
</script>
